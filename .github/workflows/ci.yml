name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ml/requirements.txt \
                      -r services/rag/requirements.txt \
                      -r requirements-dev.txt

      - name: Train models (small run)
        run: python services/ml/src/train.py --generate 8000

      - name: Build knowledge base
        run: python services/rag/src/knowledge_base.py --no-qdrant

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Lint
        run: ruff check services/ tests/ || true
