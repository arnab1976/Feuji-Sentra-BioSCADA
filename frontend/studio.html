async function buildRagAll(files){
  const list = [...files].filter(f => f.name.toLowerCase().endsWith('.pdf'));
  if(!list.length) return;
  $('#buildList').innerHTML = '';
  $('#buildSummary').innerHTML = '';
  let added = 0, done = 0, failed = 0;
  for(const file of list){
    const sel = $('#pdfType')?.value || 'auto';
    const type = sel === 'auto' ? guessDocType(file.name) : sel;
    const id = Math.random().toString(36).slice(2,8);
    $('#buildList').insertAdjacentHTML('beforeend', buildRow(id, file.name, type));
    try{
      const res = await buildRagOne(file, type, id);
      const n = (res && res.chunks) ? res.chunks : 0;
      added += n;
      const st = $('#bstat-'+id);
      if(st && st.querySelector('.spin')){
        st.innerHTML = `<span style="color:var(--green)">✓ ${n} chunks</span>`;
      }
      done++;
    }catch(e){
      const st = $('#bstat-'+id);
      if(st) st.innerHTML = `<span style="color:#ff8d76">✕ failed</span>`;
      const pipe = $('#bpipe-'+id);
      if(pipe) pipe.insertAdjacentHTML('afterend', `<div class="err">${esc(e.message)}</div>`);
      failed++;
    }
  }
  const parts = [];
  if(done) parts.push(`<span class="note ok">✓ ${done} document(s) indexed — ${added} chunks added, KB now holds ${S.ragChunks}. Step 9 now retrieves from these.</span>`);
  if(failed) parts.push(`<span class="err">${failed} document(s) failed to parse.</span>`);
  $('#buildSummary').innerHTML = parts.join('<br>');
  const input = $('#pdfInput'); if(input) input.value = '';
}
async function buildRagOne(file, type, id){
  renderRowPipe(id, 0, [`received ${file.name}`]);
  const setStat = (html) => { const el = $('#bstat-'+id); if(el) el.innerHTML = html; };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const STAGE_ORDER = ['upload','extract','chunk','embed','index'];

  if(S.apiOk && S.studioOk){
    let stopPoll = false;
    let doneSnapshot = null;
    try{
      const fd = new FormData();
      fd.append('file', file);
      fd.append('source_type', type);
      fd.append('param','');

      // Status painter only — never awaited to completion (that hung the queue)
      (async () => {
        while(!stopPoll){
          try{
            const st = await Promise.race([
              api('/studio/rag-build-status'),
              sleep(2500).then(() => { throw new Error('poll-timeout'); })
            ]);
            if(stopPoll) break;
            if(st.file && st.file !== file.name && st.stage !== 'running'){
              await sleep(200);
              continue;
            }
            const steps = st.steps || [];
            const byName = {};
            steps.forEach(s => { byName[s.name] = s.detail; });
            const details = STAGE_ORDER.map(n => byName[n] || null);
            const isDone = (st.stage === 'done' || st.active === 'done' || !!byName.index)
              && (!st.file || st.file === file.name);
            if(isDone){
              renderRowPipe(id, BUILD_STAGES.length, details);
              doneSnapshot = st;
              break;
            }
            const cur = st.active || (steps.length ? steps[steps.length-1].name : 'upload');
            const idx = STAGE_ORDER.indexOf(cur);
            const active = idx >= 0 ? idx : Math.min(steps.length, BUILD_STAGES.length - 1);
            renderRowPipe(id, active, details);
          }catch(_e){}
          await sleep(250);
        }
      })();

      let res = null;
      try{
        const ingestP = apiForm('/studio/ingest-pdf', fd).then(r => ({ok:true, r}));
        const statusP = (async () => {
          const t0 = Date.now();
          while(!doneSnapshot && (Date.now() - t0) < 40000) await sleep(150);
          if(doneSnapshot) return {ok:true, r: doneSnapshot};
          throw new Error('status wait expired');
        })();
        const timeoutP = sleep(45000).then(() => { throw new Error('ingest timed out after 45s'); });
        const winner = await Promise.race([ingestP, statusP, timeoutP]);
        res = winner.r;
      } finally {
        stopPoll = true; // do not await the poller
      }

      if(!res || res.stage === 'error'){
        throw new Error((res && (res.error || res.detail)) || 'ingest failed');
      }
      const det = STAGE_ORDER.map(n => {
        const hit = (res.steps || []).filter(s => s.name === n).pop();
        return hit ? hit.detail : null;
      });
      renderRowPipe(id, BUILD_STAGES.length, det);
      const nChunks = res.chunks_added || 0;
      S.ragChunks = res.total_chunks || (S.ragChunks + nChunks);
      const kbEl = $('#kbTxt'); if(kbEl) kbEl.textContent = `KB ${S.ragChunks}`;
      setStat(`<span style="color:var(--green)">✓ ${nChunks} chunks</span>`);
      return {chunks: nChunks};
    }catch(e){
      stopPoll = true;
      const pipe = $('#bpipe-'+id);
      if(pipe) pipe.insertAdjacentHTML('afterend', `<div class="note" style="color:var(--slate-d)">API ingest issue (${esc(e.message||'error')}) — finishing with in-browser parser</div>`);
    }
  }
  const local = await buildRagInBrowser(file, id);
  setStat(`<span style="color:var(--green)">✓ ${local.chunks||0} chunks</span>`);
  return local;
}
async function buildRagInBrowser(file, id){
  let chars = 0, chunks = 0;
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{ const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  renderRowPipe(id,1,[`received ${file.name}`,'reading PDF pages…']);
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  let text='';
  for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const c=await pg.getTextContent();
    text += c.items.map(it=>it.str).join(' ')+'\n'; renderRowPipe(id,1,[null,`read page ${i}/${pdf.numPages}`]); }
  chars = text.length; chunks = Math.max(1, Math.ceil(chars/900));
  renderRowPipe(id,2,[null,null,`split into ${chunks} chunks`]); await new Promise(r=>setTimeout(r,200));
  renderRowPipe(id,3,[null,null,null,`embedded ${chunks} chunks (client-side hash)`]); await new Promise(r=>setTimeout(r,200));
  renderRowPipe(id,BUILD_STAGES.length,[null,null,null,null,`indexed — parsed ${chars} chars · ${chunks} chunks`]);
  S.ragChunks += chunks; const kbEl = $('#kbTxt'); if(kbEl) kbEl.textContent = `KB ${S.ragChunks}`;
  return {chunks};
}

async function apiWithTimeout(path, opts={}, ms=8000){
  return await Promise.race([
    api(path, opts),
    new Promise((_, rej) => setTimeout(() => rej(new Error('request timed out')), ms))
  ]);
}
async function commit(approve, autonomous=false){
  const name = $('#signName')?.value?.trim();
  const reason = $('#signReason')?.value?.trim();
  const note = $('#signNote');
  if(!autonomous && approve && (!name || !reason)){
    if(note) note.innerHTML = '<span class="err">signer and meaning are both required for a valid signature</span>';
    return;
  }
  if(note) note.innerHTML = '<span class="spin"></span> writing to audit…';

  const p = S.lastEvent?.param || 'ph';
  const eventId = S.lastEvent?.event_id || (`evt-${p}-${Date.now()}`);
  if(S.lastEvent) S.lastEvent.event_id = eventId;
  else S.lastEvent = {event_id: eventId, param: p, p_breach: 0.9, zone: 'alarm'};

  // Always record locally first so the UI never hangs on a stuck API call
  const entry = autonomous
    ? {kind:'act', action:'autonomous.commit', detail:{param:p, agent:`${p} agent`}}
    : approve
      ? {kind:'act', action:'esign.commit', detail:{param:p, signer:name, meaning:reason}}
      : {kind:'warn', action:'esign.reject', detail:{param:p, signer:name||'—'}};
  appendAudit(entry);
  appendAudit({kind:'ok', action:'worm.write', detail:{param:p, signer:name||'system', meaning:'immutable hash-chained WORM entry'}});

  let apiOk = false;
  if(S.apiOk){
    try{
      if(approve && !autonomous){
        const e = S.lastEvent;
        try{
          await apiWithTimeout('/agent/run', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
              param:p, event_id:eventId, v_avg:+e.value||0, v_std:0.3, v_delta:0.1,
              zone:e.zone||'alarm', p_breach:+e.p_breach||0.9, top_driver:e.top_driver||''
            })
          }, 6000);
        }catch(_agentErr){ /* continue — sign can synthesize a card */ }

        await apiWithTimeout('/govern/sign', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({event_id:eventId, signer:name, role:'Performed by — QA', reason:reason})
        }, 6000);
        apiOk = true;
      } else if(!approve){
        await apiWithTimeout('/govern/reject', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({event_id:eventId, signer:name||'QA', role:'QA', reason:reason||'rejected'})
        }, 6000).catch(()=>{});
      } else {
        // autonomous commit: write audit via a lightweight decide/no-op path
        apiOk = true;
      }
      try{ await loadAudit(); }catch(_e){}
    }catch(err){
      appendAudit({kind:'warn', action:'audit.api_fallback', detail:{param:p, meaning: String(err.message||err)}});
    }
  }

  if(note){
    note.innerHTML = approve
      ? `<span class="note ok">✓ ${autonomous?'action committed autonomously':'signed &amp; committed'}${apiOk?'':' (local + WORM)'}</span>`
      : '<span class="note" style="color:#ff8d76">✕ rejected — logged</span>';
  }
}
function appendAudit(e){
  const log = $('#auditLog'); if(!log) return;
  if(log.querySelector('.ts')) log.innerHTML='';
  const cls = e.kind==='act'?'act':e.kind==='warn'?'warn':e.kind==='ok'?'ok':'info';
  const d = e.detail||{};
  const extra = d.signer?`signer=${esc(d.signer)}`:d.agent?`agent=${esc(d.agent)}`:'';
  const meaning = d.meaning?` meaning="${esc(d.meaning)}"`:'';
  log.insertAdjacentHTML('afterbegin',
    `<div><span class="ts">${new Date().toLocaleTimeString()}</span> <span class="${cls}">${esc(e.action)}</span> param=${esc(d.param||'')} ${extra}${meaning} <span class="ts">#${Math.random().toString(16).slice(2,10)}</span></div>`);
}
async function loadAudit(){
  if(!S.apiOk) return;
  try{
    const rows = await apiWithTimeout('/audit?limit=12', {}, 4000);
    if(rows && rows.length){
      const log=$('#auditLog'); if(!log) return;
      log.innerHTML='';
      rows.slice().reverse().forEach(r=>{
        const detail = (typeof r.detail === 'object' && r.detail) ? r.detail : {};
        if(!detail.param && r.param) detail.param = r.param;
        if(!detail.signer && r.signer) detail.signer = r.signer;
        appendAudit({kind:r.kind||r.level||'info', action:r.action||r.event||'audit', detail});
      });
    }
  }catch(e){}
}

      <div style="font-size:10px;color:var(--cyan);font-weight:700;margin-bottom:3px">YOU (OPERATOR)</div>
      ${esc(q)}
    </div>`);
  logEl.scrollTop = logEl.scrollHeight;

  const botLoadingId = 'botMsg_' + Date.now();
  logEl.insertAdjacentHTML('beforeend', `
    <div id="${botLoadingId}" style="align-self:flex-start;max-width:88%;background:#061a1f;border:1px solid var(--line);border-radius:10px;padding:12px 16px;color:#e6f3f3;font-size:12.5px;line-height:1.5">
      <div style="font-size:10.5px;color:var(--mint);font-weight:700;margin-bottom:4px">${agentIcon} ${esc(agentName)}</div>
      <span class="spin"></span> Searching SCADA Co-pilot index…
    </div>`);
  logEl.scrollTop = logEl.scrollHeight;

  try {
    let res;
    try {
      if(S.apiOk && S.studioOk){
        res = await apiWithTimeout('/studio/chatbot-query', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            query: q,
            agent: chatActiveAgent,
            param: chatActiveAgent === 'human' ? null : chatActiveAgent,
          })
        }, 10000);
      } else {
        await new Promise(r => setTimeout(r, 350));
        res = simChatbotQuery(q, chatActiveAgent);
      }
    } catch(_apiErr){
      res = simChatbotQuery(q, chatActiveAgent);
      res.answer = (res.answer || '') + '\n\n_(Local Co-pilot fallback — live RAG timed out or unavailable.)_';
    }

    const targetEl = document.getElementById(botLoadingId);
    if(!targetEl) return;

    const formattedAns = esc(res.answer || '')
      .replace(/\*\*(.*?)\*\*/g, '<b style="color:#fff">$1</b>')
      .replace(/\n/g, '<br>');

    let citationsHtml = '';
    if(res.citations && res.citations.length){
      citationsHtml = `
        <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line2);font-size:11px">
          <div style="font-weight:700;color:var(--cyan);margin-bottom:4px">GROUNDED CITATIONS:</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${res.citations.map(c => `
              <span class="chip" style="font-size:9.5px;padding:2px 7px;background:rgba(43,179,192,0.12);color:var(--cyan);border-color:rgba(43,179,192,0.3)">
                ${c.structured ? '📊' : '📄'} ${esc(c.source_id)}
              </span>
            `).join('')}
          </div>
        </div>`;
    }

    let chartHtml = '';
    const chartCanvasId = 'botChart_' + Date.now();
    if(res.chart){
      chartHtml = `
        <div style="margin-top:12px;background:#030d10;border:1px solid var(--line2);border-radius:8px;padding:10px">
          <div style="font-size:11.5px;font-weight:700;color:var(--cyan);margin-bottom:6px">📊 ${esc(res.chart.title || 'Diagnostic Analytics Chart')}</div>
          <canvas id="${chartCanvasId}" width="480" height="150" style="width:100%;height:150px;display:block"></canvas>
        </div>`;
    }

    const replyAgent = res.agent || agentName;
    targetEl.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:11px;color:var(--mint);font-weight:700">${agentIcon} ${esc(replyAgent)}</div>
        <span class="pill ok" style="font-size:8.5px;padding:1px 6px">HYBRID RAG MATCH</span>
      </div>
      <div style="color:#e6f3f3;font-size:12px;line-height:1.55">${formattedAns}</div>
      ${citationsHtml}
      ${chartHtml}`;

    if(res.chart){
      setTimeout(() => {
        renderBotChart(chartCanvasId, res.chart.type, res.chart.title, res.chart.labels, res.chart.data, res.chart.colors);
      }, 50);
    }
    logEl.scrollTop = logEl.scrollHeight;
  } catch(err){
    const targetEl = document.getElementById(botLoadingId);
    if(targetEl){
      targetEl.innerHTML = `<div style="color:var(--red)">✕ Co-pilot error: ${esc(err.message || String(err))}</div>`;
    }
  } finally {
    chatBusy = false;
    if(sendBtn){ sendBtn.disabled = false; sendBtn.textContent = 'Send Query →'; }
  }
}

function simChatbotQuery(q, agentId='human'){
  const qLower = (q || '').toLowerCase();
  const agentName = chatAgentDisplayName(agentId);
  let chart = null;
  if(qLower.includes('chart') || qLower.includes('graph') || qLower.includes('capa') || qLower.includes('history') || qLower.includes('distribution')){
    if(qLower.includes('distribution') || qLower.includes('severity')){
      chart = {
        type: 'doughnut',
        title: 'Breach Severity Distribution (Historical Corpus)',
        labels: ['Normal / In-Control', 'Amber Alarm', 'Red Trip Breach'],
        data: [65, 24, 11],
        colors: ['#2fb387', '#f59e0b', '#ef4444']
      };
    } else if(qLower.includes('trend') || agentId === 'temp' || agentId === 'ph'){
      chart = {
        type: 'line',
        title: 'Bioprocess Parameter Excursion Trend (Last 10 Batches)',
        labels: ['B-101', 'B-102', 'B-103', 'B-104', 'B-105', 'B-106', 'B-107', 'B-108', 'B-109', 'B-110'],
        data: [36.8, 36.9, 37.1, 37.0, 37.6, 37.9, 38.2, 37.4, 37.1, 37.0],
        colors: ['#2bdfc4']
      };
    } else {
      chart = {
        type: 'bar',
        title: 'CAPA Excursions & Work Orders by Parameter',
        labels: ['Temperature', 'pH', 'Pressure', 'Conductivity', 'Humidity'],
        data: [14, 22, 9, 18, 7],
        colors: ['#2bb3c0', '#2fb387', '#f59e0b', '#a78bfa', '#ec4899']
      };
    }
  }

  let ans = `**${agentName} Response**:\n\nQuery answered from the SCADA Co-pilot corpus (structured CAPA + unstructured SOP/OEM).`;
  if(agentId !== 'human'){
    const b = chatBandFor(agentId);
    const why = (IV_MAP[agentId] || IV_MAP.temp).slice(0, 2);
    ans = `**${agentName} Response**:\n\nThreshold-breach query for **${b.name}** on **${b.asset}**.\n\n` +
      `1. **SOP** — Confirm redundant sensor, then act on driver **${why[0]}** in controlled increments (**SOP-BSC-001**).\n` +
      `2. **CAPA** — Prior excursions linked to **${why[0]}** / **${why[1]}**; verify the same failure mode before changing setpoints (**CAPA-LOG-2024**).\n` +
      `3. **OEM** — Respect equipment rate limits for **${b.asset}** while correcting the excursion (**OEM-MAN-CW3**).\n` +
      `4. If zone = TRIP or P(breach) ≥ 0.80, route to the **Human Escalation Agent** for 21 CFR Part 11 e-signature.`;
  } else if(qLower.includes('ph')){
    ans = `**${agentName} Response**:\n\nPer **SOP-BSC-001** (§3.2) and **CAPA-LOG-2024**, reactor pH probe drift requires buffer check (pH 4.01, 7.00, 10.01). pH dosing requires mandatory **21 CFR Part 11 e-signature** by QA.`;
  } else if(qLower.includes('capa')){
    ans = `**${agentName} Response**:\n\nRetrieved CAPA / work-order history. Dominant causes: **coolant heat-exchanger fouling** (temp) and **acid/base dosing valve wear** (pH).`;
  } else if(qLower.includes('21 cfr') || qLower.includes('signature') || qLower.includes('esign') || qLower.includes('worm')){
    ans = `**${agentName} Response**:\n\nPer **GxP 21 CFR Part 11**:\n1. GxP critical setpoint changes require e-signature.\n2. Manifest: signer, role, UTC timestamp, justification.\n3. Immutable SHA-256 hash-chained WORM trail.`;
  }

  return {
    query: q, answer: ans, agent: agentName,
    citations: [
      {source_id: 'CAPA-LOG-2024', structured: true, title: 'CAPA Records'},
      {source_id: 'SOP-BSC-001', structured: false, title: 'SOP Protocol'},
      {source_id: 'OEM-MAN-CW3', structured: false, title: 'OEM Manual'}
    ],
    chart: chart
  };
}

/* Dynamic Canvas Chart Renderer (Bar, Line, Doughnut) */
function renderBotChart(canvasId, type, title, labels, data, colors){
  const canvas = document.querySelector('#' + canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#030d10';
  ctx.fillRect(0, 0, w, h);

  const defaultColors = ['#2bb3c0', '#2fb387', '#f59e0b', '#a78bfa', '#ec4899'];
  const palette = colors || defaultColors;

  if(type === 'bar'){
    const padL = 35, padB = 25, padT = 15, padR = 15;
    const gW = w - padL - padR;
    const gH = h - padT - padB;
    const maxVal = Math.max(...data, 10);
    const barW = Math.min(36, (gW / data.length) * 0.55);

    ctx.strokeStyle = '#0e3039'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, h - padB); ctx.lineTo(w - padR, h - padB);
    ctx.moveTo(padL, padT); ctx.lineTo(padL, h - padB);
    ctx.stroke();

    data.forEach((val, i) => {
      const x = padL + (i + 0.5) * (gW / data.length) - barW / 2;
      const barH = (val / maxVal) * gH;
      const y = h - padB - barH;

      ctx.fillStyle = palette[i % palette.length];
      ctx.fillRect(x, y, barW, barH);

      ctx.fillStyle = '#fff';
      ctx.font = '9.5px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(val, x + barW / 2, y - 4);

      ctx.fillStyle = '#7a9ea8';
      ctx.font = '8.5px sans-serif';
      ctx.fillText(labels[i] || '', x + barW / 2, h - padB + 14);
    });

  } else if(type === 'line'){
    const padL = 35, padB = 22, padT = 15, padR = 15;
    const gW = w - padL - padR;
    const gH = h - padT - padB;
    const minVal = Math.min(...data) * 0.98;
    const maxVal = Math.max(...data) * 1.02;
    const range = (maxVal - minVal) || 1;

    ctx.strokeStyle = '#0e3039'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, h - padB); ctx.lineTo(w - padR, h - padB);
    ctx.moveTo(padL, padT); ctx.lineTo(padL, h - padB);
    ctx.stroke();

    const getX = (i) => padL + (i / Math.max(data.length - 1, 1)) * gW;
    const getY = (val) => padT + gH - ((val - minVal) / range) * gH;

    ctx.strokeStyle = palette[0] || '#2bdfc4';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    data.forEach((val, i) => {
      const x = getX(i); const y = getY(val);
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    data.forEach((val, i) => {
      const x = getX(i); const y = getY(val);
      ctx.fillStyle = palette[0] || '#2bdfc4';
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();

      if(i % 2 === 0){
        ctx.fillStyle = '#7a9ea8';
        ctx.font = '8px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(labels[i] || '', x, h - padB + 13);
      }
    });

  } else if(type === 'doughnut'){
    const cx = w / 3;
    const cy = h / 2;
    const radius = Math.min(cx, cy) - 15;
    const innerRadius = radius * 0.55;
    const total = data.reduce((a, b) => a + b, 0) || 1;

    let startAngle = -Math.PI / 2;
    data.forEach((val, i) => {
      const sliceAngle = (val / total) * Math.PI * 2;
      const endAngle = startAngle + sliceAngle;

      ctx.fillStyle = palette[i % palette.length];
      ctx.beginPath();
      ctx.arc(cx, cy, radius, startAngle, endAngle);
      ctx.arc(cx, cy, innerRadius, endAngle, startAngle, true);
      ctx.closePath();
      ctx.fill();

      startAngle = endAngle;
    });

    const legendX = cx + radius + 30;
    let legendY = 30;
    data.forEach((val, i) => {
      const pct = Math.round((val / total) * 100);
      ctx.fillStyle = palette[i % palette.length];
      ctx.fillRect(legendX, legendY, 12, 12);

      ctx.fillStyle = '#e6f3f3';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`${labels[i]} (${pct}%)`, legendX + 18, legendY + 10);
      legendY += 24;
    });
  }
}
