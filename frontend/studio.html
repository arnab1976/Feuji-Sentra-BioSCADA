<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTRA — Streaming Event‑driven Network of Threshold Response Agents</title>
<style>
:root{
  --ink:#07171c;--panel:#0c242b;--panel2:#0e2a32;--deep:#0F3D3E;--teal:#126E82;
  --cyan:#2BB3C0;--mint:#8FD6BD;--line:#1a4049;--line2:#22505b;
  --slate:#8aa5a5;--slate-d:#5B7373;--amber:#E0A33E;--coral:#D9614C;--green:#2FB387;
  --red:#ff5a44;--redglow:rgba(255,90,68,.5);
  --mono:'SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:radial-gradient(1200px 600px at 80% -10%,#0d2b30 0%,#07171c 55%),#07171c;
  color:#d6e7e7;-webkit-font-smoothing:antialiased;line-height:1.5}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#081a1f}
::-webkit-scrollbar-thumb{background:#25505b;border-radius:6px}::-webkit-scrollbar-thumb:hover{background:#2f6572}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
  padding:11px 20px;background:linear-gradient(180deg,rgba(9,26,31,.97),rgba(8,22,27,.93));
  border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--cyan),var(--teal));
  display:grid;place-items:center;color:#04181c;font-weight:800;font-size:18px;
  box-shadow:0 0 22px rgba(43,179,192,.35)}
.brand b{color:#fff;font-size:15px;display:block;letter-spacing:.2px}
.brand span{color:var(--cyan);font-size:10px;font-weight:700;letter-spacing:2px}
.top-status{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
  background:#0c2630;border:1px solid var(--line2);color:#bcd6d6;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--slate-d)}
.pill.ok{color:var(--green);border-color:rgba(47,179,135,.4)}.pill.ok .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.pill.off{color:var(--coral);border-color:rgba(217,97,76,.4)}.pill.off .dot{background:var(--coral)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 57px)}
.rail{background:linear-gradient(180deg,#0a1f25,#081a1f);border-right:1px solid var(--line);
  padding:16px 12px 40px;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto}
.rail-head{font-size:9.5px;letter-spacing:1.8px;color:var(--slate-d);font-weight:800;
  text-transform:uppercase;margin:6px 8px 12px}
.progress-wrap{margin:0 8px 16px}
.progress-track{height:5px;border-radius:4px;background:#0c2630;overflow:hidden}
.progress-bar{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--cyan));transition:width .4s ease}
.progress-label{font-size:10px;color:var(--slate);margin-top:6px;font-family:var(--mono)}

.step-nav{display:flex;flex-direction:column;gap:1px}
.step-item{display:flex;align-items:flex-start;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer;
  position:relative;transition:.15s;border:1px solid transparent}
.step-item:hover{background:#10303a}
.step-item.active{background:linear-gradient(135deg,rgba(43,179,192,.16),rgba(18,110,130,.07));border-color:var(--line2)}
.step-item.active .step-num{background:var(--cyan);color:#04181c;border-color:var(--cyan)}
.step-item.done .step-num{background:rgba(47,179,135,.18);color:var(--green);border-color:rgba(47,179,135,.5)}
.step-num{width:24px;height:24px;flex-shrink:0;border-radius:7px;background:#0c2630;border:1px solid var(--line2);
  display:grid;place-items:center;font-size:10.5px;font-weight:700;font-family:var(--mono);color:var(--slate);margin-top:1px}
.step-tx{flex:1;min-width:0}
.step-tt{font-size:12.5px;font-weight:600;color:#cfe6e6;line-height:1.35}
.step-item.active .step-tt{color:#fff}
.step-sub{font-size:10px;color:var(--slate-d);margin-top:1px}
.step-phase{font-size:8.5px;letter-spacing:1.4px;color:var(--slate-d);font-weight:800;
  text-transform:uppercase;margin:15px 10px 6px;padding-top:12px;border-top:1px solid var(--line)}
.step-phase:first-child{border-top:none;padding-top:0;margin-top:4px}

/* ---------- main ---------- */
.main{padding:26px 34px 90px;max-width:1100px}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:2.2px;
  color:var(--cyan);font-weight:800;text-transform:uppercase;margin-bottom:10px}
.eyebrow .n{font-family:var(--mono);background:rgba(43,179,192,.12);border:1px solid rgba(43,179,192,.3);
  padding:2px 7px;border-radius:5px;letter-spacing:1px}
h1{font-size:26px;color:#fff;font-weight:750;margin-bottom:8px;letter-spacing:-.3px}
.lead{font-size:14px;color:var(--slate);max-width:720px;line-height:1.6;margin-bottom:22px}
.lead b{color:#bcd6d6;font-weight:600}

/* cards */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:14px;padding:18px 19px;margin-bottom:16px;position:relative}
.card h3{font-size:13px;color:#fff;font-weight:650;display:flex;align-items:center;gap:9px;margin-bottom:14px;
  padding-bottom:11px;border-bottom:1px solid var(--line)}
.card h3 .ic{width:22px;height:22px;border-radius:6px;background:rgba(43,179,192,.13);display:grid;place-items:center;
  font-size:12px}
.card h3 .tag{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--slate-d);font-weight:500;letter-spacing:.5px}

.grid{display:grid;gap:13px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1080px){.g5,.g4{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.shell{grid-template-columns:1fr}.rail{display:none}.g5,.g4,.g3,.g2{grid-template-columns:1fr}}

/* buttons */
.btn{font-family:var(--sans);font-size:12.5px;font-weight:650;padding:10px 17px;border-radius:9px;
  border:1px solid var(--line2);background:#10303a;color:#cfe6e6;cursor:pointer;transition:.15s;
  display:inline-flex;align-items:center;gap:8px}
.btn:hover:not(:disabled){background:#164049;border-color:var(--teal);color:#fff;transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--teal));border-color:transparent;color:#04181c;
  box-shadow:0 4px 16px rgba(43,179,192,.25)}
.btn.primary:hover:not(:disabled){box-shadow:0 6px 22px rgba(43,179,192,.4);color:#04181c}
.btn.ghost{background:transparent}
.btn.green{background:rgba(47,179,135,.15);border-color:rgba(47,179,135,.45);color:var(--green)}
.btn.amber{background:rgba(224,163,62,.14);border-color:rgba(224,163,62,.4);color:var(--amber)}
.btn.coral{background:rgba(217,97,76,.14);border-color:rgba(217,97,76,.45);color:#ff8d76}
.btn.sm{padding:7px 12px;font-size:11.5px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}

/* nav footer */
.stepbar{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:18px;
  border-top:1px solid var(--line);gap:10px;flex-wrap:wrap}
.stepbar .hint{font-size:11.5px;color:var(--slate-d)}
.page-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin:0 0 16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:linear-gradient(180deg,rgba(14,42,50,0.55),rgba(8,26,31,0.75))}
.page-nav .page-nav-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.page-nav .page-nav-meta{font-size:11px;color:var(--slate);font-family:var(--mono)}
.page-nav .page-nav-meta b{color:var(--cyan);font-weight:700}
.arch-marquee-wrap{flex:1;min-height:0;overflow:hidden;position:relative}
.arch-marquee-track{display:flex;flex-direction:column;gap:10px;will-change:transform}
.arch-marquee-wrap.is-paused .arch-marquee-track{animation-play-state:paused !important}
@keyframes archScrollUp{
  0%{transform:translateY(0)}
  100%{transform:translateY(-50%)}
}

/* forms */
label{display:block;font-size:11px;font-weight:650;color:#aecaca;margin-bottom:6px;letter-spacing:.2px}
input,select{width:100%;font-family:var(--sans);font-size:12.5px;padding:10px 12px;border-radius:8px;
  background:#081a1f;border:1px solid var(--line2);color:#e6f3f3;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(43,179,192,.12)}
.field{margin-bottom:13px}

/* tiles / data */
.tile{background:#081a1f;border:1px solid var(--line);border-radius:11px;padding:13px;position:relative;transition:.2s}
.tile .nm{font-size:11px;color:var(--slate);font-weight:600}
.tile .vl{font-family:var(--mono);font-size:23px;font-weight:700;color:#fff;margin:4px 0 2px;letter-spacing:-.5px}
.tile .vl small{font-size:11px;color:var(--slate);font-weight:400}
.tile .bd{font-size:9.5px;color:var(--slate-d);font-family:var(--mono)}
.tile .badge{position:absolute;top:11px;right:11px;font-size:8px;font-weight:800;padding:3px 8px;border-radius:12px;letter-spacing:.6px}
.b-ok{background:rgba(47,179,135,.16);color:var(--green)}
.b-alarm{background:rgba(224,163,62,.2);color:var(--amber)}
.b-trip{background:rgba(217,97,76,.22);color:#ff8d76}
.tile.trip{border-color:var(--redglow);animation:redpulse 1.4s infinite}
@keyframes redpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,68,0)}50%{box-shadow:0 0 18px 2px rgba(255,90,68,.3)}}

.kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:7px 0;border-bottom:1px dotted #17363f}
.kv:last-child{border:none}.kv .k{color:var(--slate)}.kv .v{font-family:var(--mono);color:#cfe6e6;text-align:right}
.kv .v.c{color:var(--cyan)}.kv .v.g{color:var(--green)}.kv .v.a{color:var(--amber)}.kv .v.r{color:#ff8d76}

pre.code{font-family:var(--mono);font-size:11px;line-height:1.7;background:#050f13;border:1px solid var(--line);
  border-radius:10px;padding:14px;color:#9fc4c4;overflow-x:auto;white-space:pre-wrap;tab-size:2}
pre.code .kw{color:var(--cyan)}pre.code .fn{color:var(--mint)}pre.code .cm{color:var(--slate-d)}

.log{font-family:var(--mono);font-size:10.5px;background:#050f13;border:1px solid var(--line);border-radius:10px;
  padding:12px;height:200px;overflow-y:auto;line-height:1.85}
.log .ts{color:var(--slate-d)}.log .ok{color:var(--green)}.log .warn{color:var(--amber)}
.log .act{color:var(--cyan)}.log .info{color:#8fb9c4}.log .red{color:var(--red);font-weight:700}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:3px 9px;border-radius:20px;
  background:#0c2630;border:1px solid var(--line2);color:#bcd6d6;font-family:var(--mono)}
.chip.sop{color:var(--cyan);border-color:rgba(43,179,192,.35)}
.chip.capa{color:var(--amber);border-color:rgba(224,163,62,.35)}
.chip.oem{color:var(--mint);border-color:rgba(143,214,189,.35)}

.note{font-size:11.5px;color:var(--slate-d);margin-top:9px;line-height:1.5}
.note.ok{color:var(--green)}.err{color:#ff8d76;font-size:11.5px;margin-top:9px}

/* dropzone */
.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:26px 20px;text-align:center;
  cursor:pointer;transition:.2s;background:#081a1f}
.drop:hover,.drop.drag{border-color:var(--cyan);background:#0a2028}
.drop .di{font-size:26px;margin-bottom:8px;opacity:.8}
.drop .dt{font-size:13px;color:#cfe6e6;font-weight:600}
.drop .ds{font-size:11px;color:var(--slate-d);margin-top:4px}

/* pipeline stepper (flink live + rag build) */
.pipe{display:flex;flex-direction:column;gap:0}
.pipe-op{display:flex;gap:13px;align-items:flex-start;padding:11px 0;position:relative}
.pipe-op:not(:last-child)::after{content:"";position:absolute;left:15px;top:34px;bottom:-2px;width:2px;background:var(--line2)}
.pipe-op.active:not(:last-child)::after{background:linear-gradient(var(--cyan),var(--line2))}
.pipe-dot{width:32px;height:32px;flex-shrink:0;border-radius:9px;background:#0c2630;border:1px solid var(--line2);
  display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--slate);z-index:1;transition:.3s}
.pipe-op.active .pipe-dot{background:var(--cyan);color:#04181c;border-color:var(--cyan);box-shadow:0 0 16px rgba(43,179,192,.4)}
.pipe-op.done .pipe-dot{background:rgba(47,179,135,.18);color:var(--green);border-color:rgba(47,179,135,.5)}
.pipe-body{flex:1;padding-top:3px}
.pipe-nm{font-size:13px;font-weight:650;color:#e6f3f3}
.pipe-op.active .pipe-nm{color:#fff}
.pipe-dt{font-size:11.5px;color:var(--slate);margin-top:2px;line-height:1.45}
.pipe-out{font-family:var(--mono);font-size:10.5px;color:var(--mint);margin-top:6px;background:#050f13;
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;display:none}
.pipe-op.active .pipe-out,.pipe-op.done .pipe-out{display:block}

/* agent roster */
.agent{background:#081a1f;border:1px solid var(--line);border-radius:11px;padding:14px;transition:.2s}
.agent:hover{border-color:var(--line2)}
.agent .ah{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.agent .aic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;
  background:rgba(43,179,192,.13)}
.agent .an{font-size:12.5px;font-weight:700;color:#fff}
.agent .ar{font-size:9.5px;color:var(--slate-d);font-family:var(--mono)}
.agent .ad{font-size:11px;color:var(--slate);line-height:1.5}
.agent.human{border-color:rgba(224,163,62,.35);background:linear-gradient(180deg,rgba(224,163,62,.06),#081a1f)}
.agent.human .aic{background:rgba(224,163,62,.16)}
.agent.orch{border-color:rgba(43,179,192,.4);background:linear-gradient(180deg,rgba(43,179,192,.07),#081a1f)}

/* remedy steps */
.rstep{display:flex;gap:11px;padding:10px 0;border-bottom:1px dotted #17363f}
.rstep:last-child{border:none}
.rstep .rn{width:22px;height:22px;flex-shrink:0;border-radius:6px;background:rgba(43,179,192,.16);color:var(--cyan);
  display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--mono)}
.rstep .rt{font-size:12px;color:#cfe6e6;line-height:1.5}
.cite{display:inline-block;font-family:var(--mono);font-size:9.5px;color:var(--mint);
  background:rgba(143,214,189,.08);border:1px solid rgba(143,214,189,.22);padding:2px 7px;border-radius:5px;margin-top:5px}
.hit{background:#081a1f;border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:8px}
.hit .hh{display:flex;gap:8px;align-items:center;font-size:11px;margin-bottom:6px}
.hit .sc{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--cyan)}
.hit .tx{font-size:11.5px;color:#bcd6d6;line-height:1.5}

.decision{border-radius:11px;padding:15px;text-align:center;margin-top:12px}
.decision.allow{background:rgba(47,179,135,.1);border:1px solid rgba(47,179,135,.4)}
.decision.esign{background:rgba(224,163,62,.1);border:1px solid rgba(224,163,62,.4)}
.decision b{font-size:16px;letter-spacing:.4px}
.decision.allow b{color:var(--green)}.decision.esign b{color:var(--amber)}
.decision small{display:block;color:var(--slate);font-size:11px;margin-top:5px}

.mono-tag{font-family:var(--mono);font-size:10px;color:var(--slate-d)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(43,179,192,.25);
  border-top-color:var(--cyan);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
a.dl{color:var(--cyan);text-decoration:none;border-bottom:1px dotted var(--cyan)}

/* ---------- Home Page Styles ---------- */
.hero-card{background:linear-gradient(135deg,rgba(18,110,130,.28),rgba(14,42,50,.96) 40%,rgba(7,23,28,.98));
  border:1px solid rgba(43,179,192,.4);border-radius:16px;padding:30px 34px;margin-bottom:18px;
  box-shadow:0 8px 32px rgba(0,0,0,.45),0 0 40px rgba(43,179,192,.12);position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;top:-50%;right:-20%;width:420px;height:420px;
  background:radial-gradient(circle,rgba(43,179,192,.2) 0%,transparent 70%);pointer-events:none}
.hero-title{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.8px;line-height:1.25;margin-bottom:6px}
.hero-sub{font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:.5px;margin-bottom:14px}
.hero-desc{font-size:13.5px;color:var(--slate);line-height:1.65;max-width:900px;margin-bottom:22px}

.tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
.tech-card{background:#081a1f;border:1px solid var(--line);border-radius:12px;padding:15px;transition:.2s}
.tech-card:hover{border-color:var(--cyan);box-shadow:0 4px 20px rgba(43,179,192,.12)}
.tech-header{font-size:11.5px;font-weight:750;color:var(--cyan);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.tech-pills{display:flex;flex-wrap:wrap;gap:6px}
.tech-pill{font-size:11px;font-family:var(--mono);padding:4px 9px;border-radius:6px;background:rgba(18,110,130,.18);border:1px solid rgba(43,179,192,.25);color:#d6e7e7}

.arch-img-card{background:linear-gradient(180deg,#0a2128,#07171c);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.sentra-flow{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:4px;padding:2px 0}
.sentra-flow-step{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid rgba(43,179,192,0.22);background:linear-gradient(120deg,rgba(12,40,48,0.9),rgba(6,22,28,0.95));animation:flowPulse 3.6s ease-in-out infinite}
.sentra-flow-step:nth-child(1){animation-delay:0s}
.sentra-flow-step:nth-child(3){animation-delay:.35s}
.sentra-flow-step:nth-child(5){animation-delay:.7s}
.sentra-flow-step:nth-child(7){animation-delay:1.05s}
.sentra-flow-step:nth-child(9){animation-delay:1.4s}
.sentra-flow-num{width:22px;height:22px;border-radius:7px;background:rgba(43,179,192,0.18);border:1px solid rgba(43,179,192,0.45);color:var(--cyan);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--mono)}
.sentra-flow-body{min-width:0}
.sentra-flow-title{font-size:11.5px;font-weight:750;color:#fff;line-height:1.2}
.sentra-flow-sub{font-size:10px;color:var(--slate);line-height:1.35;margin-top:2px}
.sentra-flow-arrow{text-align:center;color:var(--cyan);font-size:11px;opacity:.7;line-height:1;animation:flowArrow 1.6s ease-in-out infinite}
@keyframes flowPulse{0%,100%{border-color:rgba(43,179,192,0.22)}50%{border-color:rgba(43,179,192,0.55)}}
@keyframes flowArrow{0%,100%{opacity:.35;transform:translateY(-1px)}50%{opacity:1;transform:translateY(2px)}}

.phase-card{background:#081a1f;border:1px solid var(--line);border-radius:12px;padding:15px;transition:.2s;height:100%;display:flex;flex-direction:column}
.phase-card:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}

/* Web Audio API Alarm Beep Synthesizer */
let audioCtx = null;
function playAlarmBeep(isTrip){
  if(!S.soundEnabled) return;
  try {
    if(!audioCtx){
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(AudioCtx) audioCtx = new AudioCtx();
    }
    if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const freq = isTrip ? 1200 : 880;
    const dur = isTrip ? 0.28 : 0.16;

    osc.type = isTrip ? 'sawtooth' : 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if(isTrip){
      osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + dur);
    }

    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

/* Canvas Dotted-Line Streaming Chart (X: Timestamp, Y: Parameter Value) */
function drawDottedSparkline(paramId, history, band){
  const canvas = document.querySelector(`#canvas_${paramId}`);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#030d10';
  ctx.fillRect(0, 0, w, h);

  if(!history || history.length < 2) {
    ctx.strokeStyle = '#0d2d35';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(25, h - 14); ctx.lineTo(w - 5, h - 14);
    ctx.moveTo(25, 4); ctx.lineTo(25, h - 14);
    ctx.stroke();
    return;
  }

  const bandAlarmHi = band.alarm ? band.alarm[1] : 100;
  const bandTripHi = band.trip ? band.trip[1] : 120;
  const minVal = Math.min(band.control ? band.control[0] * 0.95 : 0, ...history.map(p => p.val));
  const maxVal = Math.max(bandTripHi * 1.04, ...history.map(p => p.val));
  const range = (maxVal - minVal) || 1;

  const padL = 26, padB = 14, padT = 6, padR = 6;
  const gW = w - padL - padR;
  const gH = h - padT - padB;

  const getY = (val) => padT + gH - ((val - minVal) / range) * gH;
  const getX = (idx) => padL + (idx / Math.max(history.length - 1, 1)) * gW;

  // Grid Axes (X: Timestamp, Y: Parameter Value)
  ctx.strokeStyle = '#0e3039';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(padL, h - padB); ctx.lineTo(w - padR, h - padB); // X axis
  ctx.moveTo(padL, padT); ctx.lineTo(padL, h - padB);         // Y axis
  ctx.stroke();

  // Y-axis Bounds Labels
  ctx.fillStyle = '#518694';
  ctx.font = '8px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(maxVal.toFixed(1), padL - 2, padT + 7);
  ctx.fillText(minVal.toFixed(1), padL - 2, h - padB);

  // X-axis Timestamp Labels
  ctx.textAlign = 'left';
  if(history.length > 0) ctx.fillText(history[0].time || '', padL, h - 3);
  ctx.textAlign = 'right';
  if(history.length > 1) ctx.fillText(history[history.length - 1].time || '', w - padR, h - 3);

  // Dotted Alarm Reference Line
  const alarmY = getY(bandAlarmHi);
  if(alarmY >= padT && alarmY <= h - padB){
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.45)';
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.moveTo(padL, alarmY); ctx.lineTo(w - padR, alarmY);
    ctx.stroke();
  }

  const latest = history[history.length - 1];
  const isTrip = latest.flag === 'RED' || latest.zone === 'trip';
  const isAlarm = latest.flag === 'AMBER' || latest.zone === 'alarm';
  const lineColor = isTrip ? '#ef4444' : isAlarm ? '#f59e0b' : '#2fb387';

  // LIVE DOTTED STREAMING LINE
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();

  history.forEach((pt, i) => {
    const x = getX(i);
    const y = getY(pt.val);
    if(i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Data point markers
  ctx.setLineDash([]);
  history.forEach((pt, i) => {
    const x = getX(i);
    const y = getY(pt.val);
    const ptColor = (pt.flag === 'RED' || pt.zone === 'trip') ? '#ef4444' : (pt.flag === 'AMBER' || pt.zone === 'alarm') ? '#f59e0b' : '#2fb387';
    ctx.fillStyle = ptColor;
    ctx.beginPath();
    ctx.arc(x, y, i === history.length - 1 ? 3.5 : 1.8, 0, Math.PI * 2);
    ctx.fill();
  });

  // Pulsing Live Indicator Ring
  if(history.length > 0){
    const lastX = getX(history.length - 1);
    const lastY = getY(latest.val);
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(lastX, lastY, 5.5, 0, Math.PI * 2);
    ctx.stroke();
  }
}

}

}

/* ================= NAV / PROGRESS ================= */
function buildNav(){
  let html = '', lastPhase = '';
  STEPS.forEach((s,i) => {
    if(s.phase !== lastPhase){ html += `<div class="step-phase">${s.phase}</div>`; lastPhase = s.phase; }
    html += `<div class="step-item" data-i="${i}" id="nav-${i}">
      <div class="step-num">${s.n}</div>
      <div class="step-tx"><div class="step-tt">${s.t}</div><div class="step-sub">${s.sub}</div></div></div>`;
  });
  $('#stepNav').innerHTML = html;
  $$('.step-item').forEach(el => el.onclick = () => go(+el.dataset.i));
}
function go(i){
  // Stop stream polling / RED dialog when leaving Stream step
  if(STEPS[S.cur]?.id === 'stream' && STEPS[i]?.id !== 'stream'){
    if(streamTimer){ clearInterval(streamTimer); streamTimer = null; }
    streamFlinkDialogOpen = false;
  }
  S.cur = i; S.visited.add(i);
  $$('.step-item').forEach((el,idx)=>{
    el.classList.toggle('active', idx===i);
    el.classList.toggle('done', S.visited.has(idx) && idx!==i);
  });
  const pct = Math.round(S.visited.size/STEPS.length*100);
  $('#progBar').style.width = pct+'%'; $('#progNum').textContent = S.visited.size;

  const rail = $('.rail');
  const shell = $('.shell');
  const main = $('#main');
  if (i === 0) {
    if(rail) rail.style.display = 'none';
    if(shell) shell.style.gridTemplateColumns = '1fr';
    if(main) { main.style.maxWidth = '100%'; main.style.padding = '10px 16px 10px'; }
  } else {
    if(rail) rail.style.display = 'block';
    if(shell) shell.style.gridTemplateColumns = '280px 1fr';
    if(main) { main.style.maxWidth = '1100px'; main.style.padding = '26px 34px 90px'; }
  }

  renderStep(STEPS[i].id);
  $('#main').scrollTo(0,0); window.scrollTo(0,0);
}
function nav(dir){ const n = S.cur+dir; if(n>=0 && n<STEPS.length) go(n); }
function goHome(){ go(0); }
function goBack(){
  if(S.cur > 0) nav(-1);
  else goHome();
}
/** Top Home / Back chrome — hidden on the home (overview) page. */
function pageNav(){
  if(S.cur === 0) return '';
  const step = STEPS[S.cur] || {};
  const prevLabel = S.cur > 1 ? (STEPS[S.cur-1]?.t || 'Back') : 'Home';
  return `<div class="page-nav" role="navigation" aria-label="Page navigation">
    <div class="page-nav-left">
      <button type="button" class="btn ghost sm" onclick="goHome()" title="Return to Home / Overview">🏠 Home</button>
      <button type="button" class="btn sm" onclick="goBack()" title="Go back to ${esc(prevLabel)}">← Back</button>
    </div>
    <div class="page-nav-meta">Step <b>${esc(step.n || String(S.cur))}</b> · ${esc(step.t || '')}</div>
  </div>`;
}
function stepbar(){
  if (S.cur === 0) return '';
  const prevLabel = S.cur > 1 ? (STEPS[S.cur-1]?.t || 'Previous') : 'Home';
  const prev = `<button type="button" class="btn ghost sm" onclick="goBack()">← ${esc(prevLabel)}</button>`;
  const mid = `<button type="button" class="btn ghost sm" onclick="goHome()">🏠 Home</button>`;
  const next = S.cur<STEPS.length-1
    ? `<button type="button" class="btn primary sm" onclick="nav(1)">${esc(STEPS[S.cur+1].t)} →</button>`
    : '<span class="mono-tag">end of pipeline</span>';
  return `<div class="stepbar"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${prev}${mid}</div>${next}</div>`;
}

/* ================= BOOT ================= */
async function boot(){
  buildNav();
  try{
    const h = await api('/health');
    S.apiOk = true;
    S.ragChunks = h.kb_chunks || 0;
    try{ S.bands = await api('/studio/bands'); S.studioOk = true; }
    catch{ S.bands = FALLBACK_BANDS; S.studioOk = false; }
    try{ S.kbStats = await api('/rag/stats'); }catch{}
    try{
      const res = await api('/studio/datasets');
      if(res && (res.saved || res.pending)){
        S.datasets = res.saved || {};
        S.pendingDatasets = res.pending || {};
      } else if(res && typeof res === 'object'){
        S.datasets = res;
      }
    }catch{}
  }catch(e){
    S.apiOk=false; S.bands=FALLBACK_BANDS;
    loadLocalDatasets();
  }
  go(0);
  if(typeof pollStudioTelemetry === 'function'){
    if(studioTelemetryTimer) clearInterval(studioTelemetryTimer);
    studioTelemetryTimer = setInterval(pollStudioTelemetry, 1000);
    pollStudioTelemetry();
  }
}

function wireSentraJourneyPlayer(){
  const vid = $('#sentraJourneyVideo');
  const overlay = $('#sentraVideoOverlay');
  const playBtn = $('#sentraPlayBtn');
  if(!vid) return;

  // Never autoplay — wait for explicit user start
  try{ vid.pause(); }catch(_e){}
  vid.currentTime = 0;
  vid.muted = false;
  vid.volume = 0.85;

  const hideOverlay = () => { if(overlay) overlay.style.display = 'none'; };
  const showOverlay = () => { if(overlay) overlay.style.display = 'flex'; };
  showOverlay();

  const startPlayback = () => {
    hideOverlay();
    vid.muted = false;
    vid.play().catch(()=>{
      // If browser still blocks sound, mute then play, user can unmute in controls
      vid.muted = true;
      vid.play().catch(()=>{});
    });
    if(playBtn) playBtn.textContent = '⏸ Playing…';
  };

  if(overlay) overlay.onclick = startPlayback;
  if(playBtn){
    playBtn.onclick = () => {
      if(vid.paused) startPlayback();
      else { vid.pause(); if(playBtn) playBtn.textContent = '▶ Play Journey'; showOverlay(); }
    };
  }
  vid.addEventListener('pause', () => {
    if(playBtn && !vid.ended) playBtn.textContent = '▶ Play Journey';
  });
  vid.addEventListener('play', () => {
    hideOverlay();
    if(playBtn) playBtn.textContent = '⏸ Playing…';
  });
  vid.addEventListener('ended', () => {
    if(playBtn) playBtn.textContent = '▶ Play Journey';
    showOverlay();
  });
}

AFTER.upload = () => {
  const drop = $('#drop'), input = $('#fileInput');
  drop.onclick = () => input.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
  drop.ondragleave = () => drop.classList.remove('drag');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('drag'); handleFiles(e.dataTransfer.files); };
  input.onchange = () => handleFiles(input.files);
  refreshDatasetCatalog().then(() => renderDatasets());

async function refreshDatasetCatalog(){
  if(!(S.apiOk && S.studioOk)) return;
  try{
    const res = await api('/studio/datasets');
    // New shape: {saved, pending}. Old shape: flat map of param→meta.
    if(res && (res.saved || res.pending)){
      S.datasets = res.saved || {};
      S.pendingDatasets = res.pending || {};
    } else if(res && typeof res === 'object'){
      S.datasets = res;
      S.pendingDatasets = S.pendingDatasets || {};
    }
  }catch(_e){}
}

async function handleFiles(files){
  const list = [...files];
  if(!list.length) return;
  const ok = [], failed = [];
  for(const f of list){
    $('#upNote').innerHTML = `<span class="spin"></span> reading ${esc(f.name)}… (${ok.length+failed.length+1}/${list.length})`;
    if(S.apiOk && S.studioOk){
      try{
        const fd = new FormData(); fd.append('file', f);
        const d = await apiForm('/studio/upload-dataset', fd);
        S.pendingDatasets[d.param] = d;
        // If a new upload replaces a prior save intent, keep saved until Save overwrites
        ok.push(d.name||d.param);
      }catch(e){
        const pid = guessParam(f.name);
        if(pid){
          S.pendingDatasets[pid] = localDataset(pid, false);
          ok.push(S.pendingDatasets[pid].name);
        }
        else failed.push(`${f.name}: ${e.message}`);
      }
    } else {
      const pid = guessParam(f.name);
      if(pid){
        S.pendingDatasets[pid] = localDataset(pid, false);
        persistLocalDatasets();
        ok.push(S.pendingDatasets[pid].name);
      }
      else failed.push(`${f.name}: couldn't identify the parameter from the filename`);
    }
  }
  const parts = [];
  if(ok.length) parts.push(`<span class="note ok">✓ staged ${ok.length} dataset(s) — click <b>Save</b> to keep permanently</span>`);
  if(failed.length) parts.push(`<span class="err">${failed.map(esc).join('<br>')}</span>`);
  $('#upNote').innerHTML = parts.join('<br>');
  const input = $('#fileInput'); if(input) input.value = '';
  renderDatasets();
}

function localDataset(pid, saved=false){
  const b = S.bands.find(x=>x.param===pid) || FALLBACK_BANDS.find(x=>x.param===pid);
  return {
    param:pid, name:b.name, asset:b.asset, rows:1200,
    dependent_variable:pid, independent_variables:IV_MAP[pid], model_label:b.model_label,
    control_band:b.control, source:'local', saved, status: saved ? 'saved' : 'pending',
    columns: ['timestamp','batch_id','asset', ...(IV_MAP[pid]||[]), pid, 'zone','breach_within_15'],
  };
}

function persistLocalDatasets(){
  try{
    localStorage.setItem('bioscada_datasets', JSON.stringify({
      saved: S.datasets, pending: S.pendingDatasets
    }));
  }catch(_e){}
}
function loadLocalDatasets(){
  try{
    const raw = localStorage.getItem('bioscada_datasets');
    if(!raw) return;
    const parsed = JSON.parse(raw);
    S.datasets = parsed.saved || {};
    S.pendingDatasets = parsed.pending || {};
  }catch(_e){}
}

function guessParam(name){
  const n = name.toLowerCase();
  if(n.includes('temp')||n.includes('reactor')) return 'temp';
  if(n.includes('press')||n.includes('differential')) return 'press';
  if(n.includes('cond')||n.includes('wfi')) return 'cond';
  if(n.includes('hum')||n.includes('cleanroom')) return 'hum';
  if(n.includes('ph')||n.match(/\bph\b/)) return 'ph';
  return null;
}

function renderDatasets(){
  const el = $('#dsList'); if(!el) return;
  const pending = Object.values(S.pendingDatasets || {});
  const saved = Object.values(S.datasets || {});
  if(!pending.length && !saved.length){ el.innerHTML=''; const pv=$('#dsPreview'); if(pv) pv.innerHTML=''; return; }

  const card = (d, kind) => {
    const isSaved = kind === 'saved';
    const btns = isSaved
      ? `<button type="button" class="btn sm primary ds-display" data-param="${esc(d.param)}" style="font-weight:700">Display</button>
         <button type="button" class="btn sm ghost ds-delete" data-param="${esc(d.param)}" data-kind="saved" style="color:var(--red);border-color:rgba(239,68,68,0.35)">Delete</button>`
      : `<button type="button" class="btn sm green ds-save" data-param="${esc(d.param)}" style="font-weight:700">Save</button>
         <button type="button" class="btn sm ghost ds-delete" data-param="${esc(d.param)}" data-kind="pending" style="color:var(--red);border-color:rgba(239,68,68,0.35)">Delete</button>`;
    return `<div class="tile" style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div class="nm">${esc(d.name)} · ${esc(d.asset||'')}</div>
        <span class="chip" style="font-size:9.5px;padding:2px 7px;color:${isSaved?'var(--mint)':'var(--amber)'}">${isSaved?'SAVED':'PENDING SAVE'}</span>
      </div>
      <div class="vl" style="font-size:15px">${d.rows||'—'} <small>rows</small></div>
      <div class="kv"><span class="k">Dependent var</span><span class="v c">${esc(d.dependent_variable||d.param)}</span></div>
      <div class="kv"><span class="k">Independent vars</span><span class="v">${(d.independent_variables||[]).length}</span></div>
      <div class="kv"><span class="k">Model</span><span class="v g">${esc(d.model_label||'')}</span></div>
      <div class="btn-row" style="margin-top:4px;gap:8px;flex-wrap:wrap">${btns}</div>
    </div>`;
  };

  el.innerHTML = `
    ${pending.length ? `<div class="card"><h3><span class="ic">⏳</span> Uploaded — awaiting Save<span class="tag">${pending.length}</span></h3>
      <div class="grid g2">${pending.map(d=>card(d,'pending')).join('')}</div>
      <div class="note">Save writes the CSV permanently so Stream / Train can reuse it after restart. Delete discards the staged upload.</div></div>` : ''}
    ${saved.length ? `<div class="card"><h3><span class="ic">✅</span> Permanently saved datasets<span class="tag">${saved.length} of 5</span></h3>
      <div class="grid g2">${saved.map(d=>card(d,'saved')).join('')}</div>
      <div class="note">Display shows 5 sample observations plus each variable's type and description. Delete removes the stored CSV permanently.</div></div>` : ''}`;

  $$('.ds-save').forEach(btn => btn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); saveDataset(btn.dataset.param); });
  $$('.ds-delete').forEach(btn => btn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); deleteDataset(btn.dataset.param, btn.dataset.kind); });
  $$('.ds-display').forEach(btn => btn.onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    displayDataset(btn.getAttribute('data-param') || btn.dataset.param);
  });
}

async function saveDataset(param){
  const note = $('#upNote');
  if(note) note.innerHTML = `<span class="spin"></span> saving ${esc(param)} permanently…`;
  if(S.apiOk && S.studioOk){
    try{
      const d = await api(`/studio/save-dataset?param=${encodeURIComponent(param)}`, {method:'POST'});
      S.datasets[param] = d;
      delete S.pendingDatasets[param];
      if(note) note.innerHTML = `<span class="note ok">✓ ${esc(d.name||param)} saved permanently</span>`;
    }catch(e){
      if(note) note.innerHTML = `<span class="err">Save failed: ${esc(e.message)}</span>`;
      return;
    }
  } else {
    const d = S.pendingDatasets[param];
    if(!d){ if(note) note.innerHTML = `<span class="err">Nothing to save for ${esc(param)}</span>`; return; }
    d.saved = true; d.status = 'saved';
    S.datasets[param] = d;
    delete S.pendingDatasets[param];
    persistLocalDatasets();
    if(note) note.innerHTML = `<span class="note ok">✓ ${esc(d.name||param)} saved locally</span>`;
  }
  renderDatasets();
}

async function deleteDataset(param, kind){
  const label = (S.datasets[param]||S.pendingDatasets[param]||{}).name || param;
  if(!confirm(`Delete dataset "${label}" permanently? This cannot be undone.`)) return;
  const note = $('#upNote');
  if(S.apiOk && S.studioOk){
    try{
      await api(`/studio/datasets/${encodeURIComponent(param)}`, {method:'DELETE'});
      delete S.datasets[param];
      delete S.pendingDatasets[param];
      if(note) note.innerHTML = `<span class="note ok">✓ ${esc(label)} deleted</span>`;
    }catch(e){
      // If only pending existed client-side
      delete S.datasets[param];
      delete S.pendingDatasets[param];
      if(note) note.innerHTML = `<span class="note ok">✓ ${esc(label)} removed</span>`;
    }
  } else {
    delete S.datasets[param];
    delete S.pendingDatasets[param];
    persistLocalDatasets();
    if(note) note.innerHTML = `<span class="note ok">✓ ${esc(label)} deleted</span>`;
  }
  const pv = $('#dsPreview'); if(pv) pv.innerHTML = '';
  renderDatasets();
}

function renderModelRows(){
  const el = $('#modelRows'); if(!el) return;
  el.innerHTML = S.bands.map(b => {
    const t = S.training[b.param];
    const status = t
      ? `<span class="v g">AUC ${t.auc}</span>`
      : `<button class="btn sm" data-train="${b.param}">Train</button>`;
    return `<div class="kv" style="align-items:center">
      <span class="k" style="display:flex;align-items:center;gap:8px">

      <span class="v" id="mrow-${b.param}">${status}</span></div>`;
  }).join('');
  $$('[data-train]').forEach(btn => btn.onclick = () => trainOne(btn.dataset.train));
}
async function trainOne(param){
  const cell = $('#mrow-'+param); if(cell) cell.innerHTML = '<span class="spin"></span>';
  let t;
  if(S.apiOk && S.studioOk){
    try{
      t = await api(`/studio/train?param=${param}`, {method:'POST'});
    }catch(e){
      t = simTrain(param); t.source = 'fallback';
    }
  } else {
    // API offline, or studio routes not available — representative model so
    // the pipeline still runs end to end
    t = simTrain(param); await new Promise(r=>setTimeout(r,500));
  }
  S.training[param] = t;
  if(cell) cell.innerHTML = `<span class="v g">AUC ${t.auc}</span>`;
}
async function trainAll(){
  $('#trainNote').innerHTML = '<span class="spin"></span> training all five models…';
  for(const b of S.bands){ await trainOne(b.param); }
  $('#trainNote').innerHTML = '<span class="note ok">✓ all models trained — see the leaderboard</span>';
}
function simTrain(param){
  const b = S.bands.find(x=>x.param===param) || FALLBACK_BANDS.find(x=>x.param===param) || {};
  const aucs = {temp:0.924, ph:0.862, press:0.906, cond:0.923, hum:0.942};
  const ivs = IV_MAP[param] || [];
  const auc = aucs[param]||0.9;
  return {param, name:b.name||param, model_label:b.model_label||'model', model:b.model||'',
    auc, accuracy:+(auc-0.01).toFixed(3), precision:0.87, recall:0.75,
    positive_rate:0.32, n_train:900, n_test:300, source:'demo',
    independent_variables:ivs,
    top_drivers:ivs.slice(0,3).map((f,i)=>({feature:f, importance:[0.42,0.28,0.19][i]}))};
}

function speakAlarm(paramName, severity, valueStr, unitStr){
  if(!S.soundEnabled && !intelSoundEnabled) return;
  try {
    playAlarmBeep(severity === 'trip');
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const text = severity === 'trip'
        ? "Critical Trip Warning! " + paramName + " has breached the safety threshold with a reading of " + valueStr + " " + unitStr + ". Automated agentic response activated."
        : "Alarm Warning! " + paramName + " threshold excursion detected. Reading is " + valueStr + " " + unitStr + ".";
      const msg = new SpeechSynthesisUtterance(text);
      msg.rate = 1.0; msg.pitch = 1.05; msg.volume = 1.0;
      window.speechSynthesis.speak(msg);
    }
  } catch(e){}
}

function waitPace(ms, myToken){

      if(!intelSpotlightPaused) waited += 100;
      if(waited >= target) resolve();

    };
    check();
  });
}

function startLabLiveTicks(breachingParamId, breachActive){
  clearLabTicks();
  labTickTimer = setInterval(() => {
    if(!labPipelineRunning) return;
    (S.bands || []).forEach(b => {
      if(!S.streamHistory[b.param]) S.streamHistory[b.param] = [];
      const mid = (b.control[0] + b.control[1]) / 2;
      const span = Math.max(0.05, (b.control[1] - b.control[0]) * 0.18);
      let v = mid + (Math.random() - 0.5) * span * 2;
      if(breachActive && b.param === breachingParamId){
        v = b.trip[1] + 1.2 + Math.random() * 1.2;
      }
      const hist = S.streamHistory[b.param];
      hist.push({ time: new Date().toLocaleTimeString(), val: v, zone: (breachActive && b.param === breachingParamId) ? 'trip' : 'control', flag: (breachActive && b.param === breachingParamId) ? 'RED' : 'OK' });
      if(hist.length > 40) hist.shift();
      const el = $(`#intelVal_${b.param}`);
      if(el){
        const isBreach = breachActive && b.param === breachingParamId;
        el.textContent = v.toFixed(2) + (b.unit || '');
        el.style.color = isBreach ? '#ff3355' : '#00ffcc';
      }
      drawDottedSparkline('intel_' + b.param, hist, b);
    });
  }, 500);
}

function waitLab(ms, myToken){
  return new Promise(resolve => {
    const t0 = Date.now();
    const tick = () => {
      if(myToken !== labRunToken) return resolve(false);
      if(Date.now() - t0 >= ms) return resolve(true);
      setTimeout(tick, 80);
    };
    tick();
  });
}

async function startLabPipeline(paramId){
  labRunToken++;
  const myToken = labRunToken;
  labPipelineRunning = true;
  clearLabTicks();
  // Silence any leftover speech from Tab 1 — this lab is mute by design
  if('speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }

  if(!S.bands || !S.bands.length) S.bands = FALLBACK_BANDS.slice();
  const band = S.bands.find(b => b.param === paramId) || S.bands[0];
  if(!band){ labPipelineRunning = false; return; }
  const agentInfo = AGENTS.find(a => a.id === paramId) || AGENTS[0];
  const breachVal = (band.trip[1] + 1.8).toFixed(2);
  const pBreach = (0.91 + Math.random() * 0.07).toFixed(3);
  const whyFeats = IV_MAP[paramId] || ['coolant_flow_rate', 'jacket_temperature', 'steam_valve_position'];

function pickProfessionalVoice(){
  try {
    const voices = window.speechSynthesis.getVoices() || [];
    const prefer = voices.find(v => /en(-|_)?(US|GB)/i.test(v.lang) && /Google|Microsoft|Samantha|Daniel|Neural/i.test(v.name))
      || voices.find(v => /^en/i.test(v.lang));
    return prefer || null;
  } catch(e){ return null; }
}

/* Industrial tone profile by risk — alarm / trip / diagnostic / status / action */
function speechToneForStep(stepNum){
  // Maps to ISA-style urgency: higher rate+pitch = higher priority alarm delivery
  if(stepNum === 1) return { rate: 1.10, pitch: 1.08, volume: 1.0, label: 'ALARM' };      // initial trip indication
  if(stepNum === 2) return { rate: 1.14, pitch: 1.12, volume: 1.0, label: 'TRIP' };       // confirmed critical
  if(stepNum === 3) return { rate: 1.02, pitch: 0.98, volume: 1.0, label: 'DIAGNOSTIC' }; // root cause briefing
  if(stepNum === 4) return { rate: 1.00, pitch: 0.94, volume: 0.95, label: 'STATUS' };    // system processing
  if(stepNum === 5) return { rate: 1.02, pitch: 0.96, volume: 1.0, label: 'STATUS' };     // retrieval handoff
  if(stepNum === 6) return { rate: 1.06, pitch: 1.02, volume: 1.0, label: 'ESCALATION' }; // agent / QA standby
  if(stepNum === 7) return { rate: 0.96, pitch: 0.90, volume: 1.0, label: 'ACTION' };     // deliberate operator orders
  return { rate: 1.0, pitch: 1.0, volume: 1.0, label: 'INFO' };
}

function buildStageNarration(stageNum, ctx){
  const paramName = ctx.paramName || 'process parameter';
  const breachVal = ctx.breachVal || '';
  const unitStr = ctx.unitStr || '';
  const asset = ctx.asset || 'process asset';
  const pBreach = ctx.pBreach || '0.90';
  const agentName = ctx.agentName || 'parameter agent';
  const why = (ctx.whyFeats || []).map(f => String(f).replace(/_/g, ' '));
  const d1 = why[0] || 'primary process driver';
  const d2 = why[1] || 'secondary process driver';
  const d3 = why[2] || 'tertiary process driver';
  const steps = ctx.actionSteps || [];
  const act1 = steps[0] || ('Return ' + paramName + ' to approved control centerline.');
  const act2 = steps[1] || ('Verify ' + d1 + ' and isolate abnormal feed.');
  const controlLo = ctx.controlLo != null ? ctx.controlLo : '';
  const controlHi = ctx.controlHi != null ? ctx.controlHi : '';
  const tripHi = ctx.tripHi != null ? ctx.tripHi : '';

  // Concise control-room instructions — no stage numbering, minimal preamble
  if(stageNum === 1){
    return [
      'Alarm. ' + paramName + ', asset ' + asset + '.',
      'Trip band exceeded. Reading ' + breachVal + ' ' + unitStr + '.',
      'Red tag active. Acknowledge and stand by for causal drivers.'
    ];
  }
  if(stageNum === 2){
    return [
      'Trip confirmed. ' + paramName + ' on ' + asset + ' is outside approved limit.',
      'Measured ' + breachVal + ' ' + unitStr + '. Control band ' + controlLo + ' to ' + controlHi + ' ' + unitStr + '. Trip at ' + tripHi + ' ' + unitStr + '.',
      'Breach probability ' + pBreach + '. Do not reset without authorization.'
    ];
  }
  if(stageNum === 3){
    return [
      'Causal drivers for ' + paramName + ' excursion.',
      'Check ' + d1 + ' first.',
      'Then verify ' + d2 + '.',
      'Then inspect ' + d3 + '.'
    ];
  }
  if(stageNum === 4){
    return [
      'Stream engine processing the breach event.',
      'Features calculated. Structured event released to remediation.'
    ];
  }
  if(stageNum === 5){
    return [
      'Approved response query issued for ' + asset + ' ' + paramName + ' excursion at ' + breachVal + ' ' + unitStr + '.',
      'Pulling SOP excursion steps, OEM checks, and CAPA actions.'
    ];
  }
  if(stageNum === 6){
    return [
      agentName + ' assigned to ' + asset + '.',
      'Orchestrator coordinating retrieval.',
      'QA supervisor on standby for Part Eleven electronic signature.'
    ];
  }
  if(stageNum === 7){
    return [
      'Operator action required.',
      'Action one. ' + act1,
      'Action two. ' + act2,
      'Electronic signature mandatory. Contact QA before any setpoint change.'
    ];
  }
  return [];
}

function speakUtterance(text, tone){
  return new Promise(resolve => {
    try {
      if(!('speechSynthesis' in window) || !text){ resolve(); return; }
      const t = tone || { rate: 1.0, pitch: 1.0, volume: 1.0 };
      const msg = new SpeechSynthesisUtterance(text);
      const voice = pickProfessionalVoice();
      if(voice) msg.voice = voice;
      msg.rate = t.rate;
      msg.pitch = t.pitch;
      msg.volume = t.volume;
      const ms = Math.min(40000, Math.max(6000, text.split(/\s+/).length * 380));
      const timer = setTimeout(() => resolve(), ms);
      msg.onend = () => { clearTimeout(timer); resolve(); };
      msg.onerror = () => { clearTimeout(timer); resolve(); };
      window.speechSynthesis.speak(msg);
    } catch(e){
      resolve();
    }
  });
}

async function waitWhileSpotlightPaused(myToken){
  while(intelSpotlightPaused){
    if(myToken && myToken !== intelRunToken) return false;
    await new Promise(r => setTimeout(r, 150));
  }
  return !(myToken && myToken !== intelRunToken);
}

async function safeSpeak(stageNum, paramName, breachVal, unitStr, whyFeats, actionSteps, agentName, extra, myToken){
  if(!intelSoundEnabled) return;
  extra = extra || {};
  const lines = buildStageNarration(stageNum, {
    paramName, breachVal, unitStr, whyFeats, actionSteps, agentName,
    asset: extra.asset, pBreach: extra.pBreach,
    controlLo: extra.controlLo, controlHi: extra.controlHi, tripHi: extra.tripHi
  });
  if(!lines.length) return;

  const tone = speechToneForStep(stageNum);
  const uiHints = {
    1: 'Alarm announcement in progress',
    2: 'Trip instruction in progress',
    3: 'Causal driver briefing in progress',
    4: 'Stream processing status',
    5: 'Approved response retrieval',
    6: 'Agent assignment briefing',
    7: 'Operator action instruction'
  };
  setIntelStageLabel(uiHints[stageNum] || 'Instruction in progress');
  if('speechSynthesis' in window){
    try { window.speechSynthesis.cancel(); } catch(e){}
  }

  for(let i = 0; i < lines.length; i++){
    if(myToken && myToken !== intelRunToken) return;
    const ok = await waitWhileSpotlightPaused(myToken);
    if(!ok) return;
    if(!intelSoundEnabled) return;
    await speakUtterance(lines[i], tone);
    await new Promise(r => setTimeout(r, 140));
  }
}

function clearIntelStreamTicks(){
  if(intelStreamTickTimer){ clearInterval(intelStreamTickTimer); intelStreamTickTimer = null; }
}

function startIntelLiveTicks(breachingParamId, breachActive){
  clearIntelStreamTicks();
  // Seed a few points so sparklines are immediately visible
  S.bands.forEach(b => {
    if(!S.streamHistory[b.param]) S.streamHistory[b.param] = [];
    if(S.streamHistory[b.param].length < 2){
      const mid = (b.control[0] + b.control[1]) / 2;
      for(let i=0;i<8;i++){
        S.streamHistory[b.param].push({
          time: new Date().toLocaleTimeString(),
          val: mid + (Math.random()-0.5) * Math.max(0.05,(b.control[1]-b.control[0])*0.2),
          zone: 'control', flag: 'OK'
        });
      }
    }
  });
  intelStreamTickTimer = setInterval(() => {
    if(intelSpotlightPaused) return;
    if(!intelPipelineRunning && !breachActive) return;
    S.bands.forEach(b => {
      if(!S.streamHistory[b.param]) S.streamHistory[b.param] = [];
      const mid = (b.control[0] + b.control[1]) / 2;
      const span = Math.max(0.05, (b.control[1] - b.control[0]) * 0.18);
      let v = mid + (Math.random() - 0.5) * span * 2;
      if(breachActive && b.param === breachingParamId){
        v = b.trip[1] + 1.2 + Math.random() * 1.2;
      }
      const hist = S.streamHistory[b.param];
      hist.push({
        time: new Date().toLocaleTimeString(),
        val: v,
        zone: (breachActive && b.param === breachingParamId) ? 'trip' : 'control',
        flag: (breachActive && b.param === breachingParamId) ? 'RED' : 'OK'
      });
      if(hist.length > 40) hist.shift();
      const el = document.querySelector('#spotlightVal_' + b.param);
      if(el){
        const isBreach = breachActive && b.param === breachingParamId;
        el.textContent = v.toFixed(2) + (b.unit || '');
        el.style.color = isBreach ? '#ff3355' : '#00ffcc';
      }
      drawDottedSparkline('spotlight_' + b.param, hist, b);
    });
  }, 450);
}

function resetIntelStageBorders(activeStageNum){
  intelActiveStage = activeStageNum;
  for(let i=1; i<=7; i++){
    const cardId = i===1?'intelStage1Card':i===2?'intelStage2Card':i===3?'intelStage3Card':i===4?'intelStage4Card':i===5?'intelStage5Card':i===6?'intelStage6Card':'intelStage7Card';
    const card = $(`#${cardId}`);
    if(card){
      if(i === activeStageNum){
        card.style.borderColor = 'var(--cyan)'; card.style.boxShadow = '0 0 16px rgba(43,179,192,0.2)';
      } else { card.style.borderColor = 'var(--line)'; card.style.boxShadow = 'none'; }
    }
  }
  // Parent grid for stages 5/6
  const g56 = $('#intelStage56Grid');
  if(g56 && (activeStageNum===5 || activeStageNum===6)){
    g56.style.borderColor = 'transparent';
  }
}

      <div class="btn-row" style="display:flex;gap:8px;flex-wrap:wrap">
        ${S.bands.map(b=>`<button class="btn amber sm" data-trig="${b.param}" style="padding:7px 14px;font-size:11.5px;font-weight:700;white-space:nowrap">⚡ Trigger ${esc(b.short)}</button>`).join('')}

    <div class="log" id="streamLog" style="height:300px;font-family:var(--mono);font-size:11.5px;background:#041216;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-y:auto;line-height:1.6">

AFTER.stream = () => {
  streamActive = true;
  ensureFlinkModal();
  wireFlinkModalHandlers();

  $$('[data-trig]').forEach(b => b.onclick = () => triggerStream(b.dataset.trig));

  const soundBtn = $('#toggleSoundBtn');
  if(soundBtn){
    soundBtn.onclick = () => {
      S.soundEnabled = !S.soundEnabled;
      soundBtn.textContent = S.soundEnabled ? '🔊 Audio Alert: ON' : '🔇 Audio Alert: OFF';
      soundBtn.className = S.soundEnabled ? 'btn sm green' : 'btn sm amber';
      if(S.soundEnabled) playAlarmBeep(false);
    };
  }
  const testBtn = $('#testBeepBtn');
  if(testBtn) testBtn.onclick = () => playAlarmBeep(true);

  $$('.stream-tab-btn').forEach(btn => {
    btn.onclick = () => selectStreamTab(btn.dataset.tab);
  });
  $$('.live-param-card').forEach(card => {
    card.onclick = () => selectStreamTab(card.dataset.streamParam);
  });

  const toggleBtn = $('#toggleStreamBtn');
  if(toggleBtn){
    toggleBtn.onclick = () => {
      streamActive = !streamActive;
      toggleBtn.textContent = streamActive ? '⏸ Pause Stream' : '▶ Resume Stream';
      toggleBtn.className = streamActive ? 'btn sm green' : 'btn sm amber';
      const pill = $('#streamPulsePill');
      if(pill){
        pill.className = streamActive ? 'pill ok' : 'pill off';
        pill.innerHTML = streamActive ? '<span class="dot"></span> LIVE SOURCE STREAMING' : '<span class="dot"></span> PAUSED';
      }
    };
  }

  const clearBtn = $('#clearStreamLogBtn');
  if(clearBtn){
    clearBtn.onclick = () => {
      const logEl = $('#streamLog');
      if(logEl) logEl.innerHTML = '<div class="ts" style="color:var(--slate)">Log cleared. Streaming live telemetry...</div>';
    };
  }

  selectStreamTab(currentStreamTab || 'all');
  if(streamTimer) clearInterval(streamTimer);
  streamTimer = setInterval(fetchLiveStreamTicks, 500);
  fetchLiveStreamTicks();
};

function selectStreamTab(tabId){
  currentStreamTab = tabId || 'all';
  $$('.stream-tab-btn').forEach(b => {
    if(b.dataset.tab === currentStreamTab) b.classList.add('primary');
    else b.classList.remove('primary');
  });

  const topicTag = $('#currentTopicTag');
  const banner = $('#streamAgentBanner');
  const logEl = $('#streamLog');

  if(currentStreamTab === 'all'){
    if(topicTag) topicTag.textContent = 'scada.telemetry & breach.events';
    if(banner) banner.style.display = 'none';
    S.bands.forEach(b => {
      const card = $(`#liveCard_${b.param}`);
      if(card){ card.style.opacity = '1'; card.style.transform = 'none'; card.style.outline = ''; }
    });
    if(logEl) logEl.insertAdjacentHTML('afterbegin', `<div class="ts" style="color:var(--slate);margin-bottom:6px">Watching ALL parameter agents • live multiplexed stream</div>`);
  } else {
    const band = S.bands.find(b => b.param === currentStreamTab) || FALLBACK_BANDS.find(b => b.param === currentStreamTab);
    const agent = AGENTS.find(a => a.id === currentStreamTab) || {icon:'🤖', name:(band?.short||currentStreamTab)+' Agent', role:'agent.execute.'+currentStreamTab, desc:'Parameter-specific diagnostic agent.'};
    if(topicTag) topicTag.textContent = `scada.telemetry.${currentStreamTab} • ${agent.name}`;
    if(banner){
      banner.style.display = 'block';
      banner.innerHTML =
        `<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">` +
          `<div style="display:flex;gap:10px;align-items:center">` +
            `<div style="font-size:22px">${agent.icon}</div>` +
            `<div>` +
              `<div style="font-size:14px;font-weight:800;color:#fff">${esc(agent.name)} — live stream</div>` +
              `<div style="font-size:11px;color:var(--slate);margin-top:2px">${esc(agent.desc)}</div>` +
              `<div style="font-size:10.5px;color:var(--cyan);font-family:var(--mono);margin-top:3px">Asset ${esc(band?.asset||'—')} • role ${esc(agent.role)} • topic scada.telemetry.${currentStreamTab}</div>` +
            `</div>` +
          `</div>` +
          `<span class="pill ok" style="padding:4px 10px;font-size:10px"><span class="dot"></span> AGENT LISTENING</span>` +
        `</div>`;
    }
    S.bands.forEach(b => {
      const card = $(`#liveCard_${b.param}`);
      if(!card) return;
      if(b.param === currentStreamTab){
        card.style.opacity = '1';
        card.style.transform = 'translateY(-2px)';
        card.style.outline = '2px solid var(--cyan)';
      } else {
        card.style.opacity = '0.45';
        card.style.transform = 'none';
        card.style.outline = '';
      }
    });
    if(logEl){

    }
  }
}

    modal.innerHTML =
      `<div style="width:min(720px,96vw);max-height:90vh;overflow:auto;background:linear-gradient(160deg,#0a1c22,#061218);border:2px solid var(--cyan);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);padding:18px 20px">` +

function wireFlinkModalHandlers(){
  const modal = ensureFlinkModal();
  const closeBtn = document.getElementById('flinkModalCloseBtn');
  const dismissBtn = document.getElementById('flinkModalDismissBtn');
  const contBtn = document.getElementById('flinkModalContinueBtn');
  if(closeBtn) closeBtn.onclick = closeFlinkSqlDialog;
  if(dismissBtn) dismissBtn.onclick = closeFlinkSqlDialog;
  if(contBtn) contBtn.onclick = proceedToFlinkSqlStep;
  modal.onclick = (ev) => { if(ev.target === modal) closeFlinkSqlDialog(); };
}

function openFlinkSqlDialog(evt){
  const modal = ensureFlinkModal();
  wireFlinkModalHandlers();
  streamFlinkDialogOpen = true;
  streamLastRedDialogAt = Date.now();

  const param = evt?.param || currentStreamTab || 'temp';
  const band = S.bands.find(b => b.param === param) || FALLBACK_BANDS.find(b => b.param === param) || {name:param, asset:'—', unit:'', trip:[0,100]};
  const agent = AGENTS.find(a => a.id === param);
  const why = evt?.why || (IV_MAP[param] || []).slice(0,3);

  }

      ['Feature aggregation','v_avg, v_std, v_delta'],
      ['PDM_SCORE UDF','Per-parameter breach probability'],

    ].map(([nm,d],i)=>`<div class="pipe-op ${i<3?'done':i===3?'active':''}"><div class="pipe-dot">${i+1}</div><div class="pipe-body"><div class="pipe-nm">${nm}</div><div class="pipe-dt">${d}</div></div></div>`).join('');
  }

function closeFlinkSqlDialog(){
  streamFlinkDialogOpen = false;
  const modal = document.getElementById('flinkNextModal');
  if(modal) modal.style.display = 'none';
}

function proceedToFlinkSqlStep(){
  closeFlinkSqlDialog();
  const idx = STEPS.findIndex(s => s.id === 'flinksql');
  if(idx >= 0) go(idx);
}

function maybeOfferFlinkDialog(evt, forced){
  if(STEPS[S.cur]?.id !== 'stream') return;
  if(!forced && streamFlinkDialogOpen) return;
  if(!forced && (Date.now() - streamLastRedDialogAt) < 20000) return;
  openFlinkSqlDialog(evt);
}

function buildLocalRedEvent(param){
  const b = S.bands.find(x => x.param === param) || FALLBACK_BANDS.find(x => x.param === param) || {param, short:param, asset:'—', alarm:[0,100], trip:[0,120], unit:''};
  const agent = AGENTS.find(a => a.id === param);
  const why = (IV_MAP[param] || ['driver_1','driver_2','driver_3']).slice(0,3);
  const lo = Array.isArray(b.alarm) ? b.alarm[1] : 100;
  const hi = Array.isArray(b.trip) ? b.trip[1] : (lo + 20);
  return {
    event_id: `evt-${param}-${Date.now()}`,
    param,
    asset: b.asset || '—',
    agent: agent?.name || `${b.short || param} Agent`,
    value: Number(lo + (hi - lo) * 0.4).toFixed(2),
    zone: 'trip',
    p_breach: (S.training?.[param]?.auc || 0.92),
    top_driver: why[0],
    why,
    flag: 'RED',
    pushed_to: 'buffer'
  };
}

async function triggerStream(param){
  playAlarmBeep(true);
  // Optimistic local RED event so UI + Flink dialog never wait on a hung API/Kafka call
  let e = buildLocalRedEvent(param);
  S.lastEvent = e;

  if(param) selectStreamTab(param);
  const log = $('#streamLog');
  if(log){
    log.insertAdjacentHTML('afterbegin',
      `<div style="margin-bottom:4px;border-left:3px solid var(--red);padding-left:6px;background:rgba(255,90,68,0.14)"><span class="ts" style="color:var(--slate)">${new Date().toLocaleTimeString()}</span> <span style="color:var(--red);font-weight:700">● RED TRIGGERED BREACH</span> <span style="color:var(--amber);font-weight:600">${esc(String(e.param).toUpperCase())}</span> p_breach=<span style="color:var(--cyan)">${e.p_breach}</span> agent=<span style="color:var(--mint)">${esc(e.agent||'')}</span> why=[<span style="color:var(--cyan)">${(e.why||[]).join(', ')}</span>]</div>`);
  }
  const detail = $('#trigDetail');
  if(detail){
    detail.innerHTML = `<div class="card"><h3><span class="ic">🚨</span> Trigger event<span class="tag">pushed to ${esc(e.pushed_to||'kafka')}</span></h3>
      <div class="grid g2"><div>
        <div class="kv"><span class="k">Event ID</span><span class="v c">${esc(e.event_id)}</span></div>
        <div class="kv"><span class="k">Responsible agent</span><span class="v">${esc(e.agent||'')}</span></div>
        <div class="kv"><span class="k">Asset</span><span class="v">${esc(e.asset)}</span></div>
      </div><div>
        <div class="kv"><span class="k">P(breach)</span><span class="v r">${e.p_breach}</span></div>
        <div class="kv"><span class="k">Flag</span><span class="v r">● ${esc(e.flag)}</span></div>
        <div class="kv"><span class="k">Top driver</span><span class="v c">${esc(e.top_driver)}</span></div>
      </div></div>
      <div class="note">The <b>“why”</b> — [${(e.why||[]).join(', ')}] — travels with the event into Flink SQL decomposition, then the agent RAG layer.</div></div>`;
  }

  const tag = $(`#liveTag_${param}`);
  const card = $(`#liveCard_${param}`);
  const valEl = $(`#liveVal_${param}`);
  const band = S.bands.find(x => x.param === param);
  if(valEl && e.value != null) valEl.textContent = `${e.value}${band?.unit || ''}`;
  if(tag){
    tag.className = 'pill off';
    tag.innerHTML = '● TRIP BREACH';
    tag.style.cssText = 'font-size:9.5px;padding:2px 7px;background:rgba(255,90,68,0.2);color:#ff5a44;border-color:rgba(255,90,68,0.5)';
  }
  if(card) card.style.borderColor = 'rgba(239,68,68,0.7)';

  // Always open next-step dialog immediately on explicit RED trigger
  openFlinkSqlDialog(e);

  // Best-effort backend notify (never block UI)
  if(S.apiOk && S.studioOk){
    try{
      const remote = await Promise.race([
        api(`/studio/stream-trigger?param=${param}`, {method:'POST'}),
        new Promise((_, rej) => setTimeout(() => rej(new Error('trigger timeout')), 2500))
      ]);
      if(remote && remote.event_id){
        S.lastEvent = remote;
        e = remote;
      }
    }catch(_err){ /* keep local event */ }
  }
}

async function fetchLiveStreamTicks(){
  if(!streamActive) return;
  const logEl = $('#streamLog');

  try {
    let data = {};
    if(S.apiOk){
      try { data = await api('/telemetry?limit=5'); } catch(e){}
    }

    if(logEl && logEl.querySelector('.ts') && logEl.children.length === 1) {
      logEl.innerHTML = '';
    }

    const paramIds = ['temp', 'ph', 'press', 'cond', 'hum'];
    const timeStr = new Date().toLocaleTimeString();

    paramIds.forEach(paramId => {
      const band = S.bands.find(b => b.param === paramId) || {param: paramId, name: paramId, short: paramId, unit: '', alarm: [0,100], trip: [0,120], asset: 'BIO-REACT-01'};
      const recs = data[paramId] || [];
      let latest = recs[recs.length - 1];

      // Always produce a fresh dataset streaming tick if missing or static
      const setpoint = band.alarm ? band.alarm[0] + (band.alarm[1] - band.alarm[0]) * 0.5 : 50;
      const roll = Math.random();
      let zone = 'normal', flag = 'GREEN', val, pBreach;

      if(latest && latest.value !== undefined){
        val = Number(latest.value).toFixed(2);
        zone = latest.zone || 'normal';
        flag = latest.flag || (zone === 'trip' ? 'RED' : zone === 'alarm' ? 'AMBER' : 'GREEN');
        pBreach = latest.p_breach !== undefined ? latest.p_breach : (roll * 0.08).toFixed(3);
      } else {
        const spread = (band.alarm ? (band.alarm[1] - band.alarm[0]) : 10) * 0.25;
        val = (setpoint + (Math.random() - 0.5) * spread).toFixed(2);
        pBreach = (Math.random() * 0.08).toFixed(3);
        if(roll > 0.95){
          zone = 'trip'; flag = 'RED';
          val = ((band.trip ? band.trip[1] : 120) + Math.random() * 0.4).toFixed(2);
          pBreach = (0.85 + Math.random() * 0.12).toFixed(3);
        } else if(roll > 0.89){
          zone = 'alarm'; flag = 'AMBER';
          val = ((band.alarm ? band.alarm[1] : 100) - Math.random() * 0.2).toFixed(2);
          pBreach = (0.45 + Math.random() * 0.2).toFixed(3);
        }
      }

      // Update Live Parameter Card Readout & Badge
      const cardValEl = $(`#liveVal_${paramId}`);
      const cardTagEl = $(`#liveTag_${paramId}`);
      const cardEl = $(`#liveCard_${paramId}`);
      if(cardValEl) cardValEl.textContent = `${val}${band.unit || ''}`;
      if(cardTagEl){
        if(flag === 'RED' || zone === 'trip'){
          cardTagEl.className = 'pill off';
          cardTagEl.innerHTML = '● TRIP BREACH';
          cardTagEl.style.cssText = 'font-size:9.5px;padding:2px 7px;background:rgba(255,90,68,0.2);color:#ff5a44;border-color:rgba(255,90,68,0.5)';
          if(cardEl) cardEl.style.borderColor = 'rgba(239,68,68,0.7)';
          playAlarmBeep(true);
        } else if(flag === 'AMBER' || zone === 'alarm'){
          cardTagEl.className = 'pill';
          cardTagEl.innerHTML = '● ALARM';
          cardTagEl.style.cssText = 'font-size:9.5px;padding:2px 7px;background:rgba(224,163,62,0.2);color:#e0a33e;border-color:rgba(224,163,62,0.5)';
          if(cardEl) cardEl.style.borderColor = 'rgba(245,158,11,0.7)';
          playAlarmBeep(false);
        } else {
          cardTagEl.className = 'pill ok';
          cardTagEl.innerHTML = '● NORMAL';
          cardTagEl.style.cssText = 'font-size:9.5px;padding:2px 7px;background:rgba(47,179,135,0.15);color:var(--green);border-color:rgba(47,179,135,0.3)';
          if(cardEl) cardEl.style.borderColor = 'var(--line)';
        }
      }

      // Maintain rolling time-series history for Dotted Sparkline Chart
      if(!S.streamHistory) S.streamHistory = {};
      if(!S.streamHistory[paramId]) S.streamHistory[paramId] = [];

      S.streamHistory[paramId].push({
        time: timeStr.split(' ')[0] || timeStr,
        val: parseFloat(val),
        zone: zone,
        flag: flag
      });

      if(S.streamHistory[paramId].length > 20){
        S.streamHistory[paramId].shift();
      }

      // Draw Live Dotted Line Streaming Graph (X: Timestamp, Y: Parameter Value)
      drawDottedSparkline(paramId, S.streamHistory[paramId], band);
      drawDottedSparkline(`intel_${paramId}`, S.streamHistory[paramId], band);
      drawDottedSparkline(`spotlight_${paramId}`, S.streamHistory[paramId], band);

      const intelValEl = document.querySelector(`#intelVal_${paramId}`);
      if(intelValEl && flag !== 'RED' && zone !== 'trip'){ intelValEl.textContent = `${val}${band.unit || ''}`; }

      const spotlightValEl = document.querySelector(`#spotlightVal_${paramId}`);
      if(spotlightValEl && flag !== 'RED' && zone !== 'trip'){ spotlightValEl.textContent = `${val}${band.unit || ''}`; }

      // Filter by parameter tab
      if(currentStreamTab !== 'all' && currentStreamTab !== paramId) return;

      const paramName = (band.short || band.name || paramId).toUpperCase();
      const unit = band.unit || '';
      const agentObj = AGENTS.find(a => a.id === paramId);
      const agentName = agentObj?.name || `${paramName} Agent`;
      const whyList = (IV_MAP[paramId] || []).slice(0,3).join(', ');

      let lineHtml = '';
      if(flag === 'RED' || zone === 'trip'){
        lineHtml = `<div style="margin-bottom:5px;border-left:4px solid var(--red);padding:4px 8px;background:rgba(255,90,68,0.12);border-radius:4px"><span class="ts" style="color:var(--slate)">${timeStr}</span> <span style="color:var(--red);font-weight:800">● RED BREACH</span> <span style="color:var(--amber);font-weight:700">${paramName}</span> value=<span style="color:#fff;font-weight:700">${val}${unit}</span> p_breach=<span style="color:var(--cyan);font-weight:700">${pBreach}</span> agent=<span style="color:var(--mint)">${esc(agentName)}</span> why=[<span style="color:var(--cyan)">${esc(whyList)}</span>]</div>`;
        const showNatural = currentStreamTab === 'all' || currentStreamTab === paramId;
        if(showNatural){
          maybeOfferFlinkDialog({
            param: paramId,

VIEWS.flinksql = () => `
  <div class="eyebrow"><span class="n">STEP 7</span> Flink</div>
  <h1>Flink SQL decomposition</h1>
  <p class="lead">Before it runs, the streaming job is a <b>relational plan</b>. Flink SQL decomposes the breach-detection query into a chain of operators — each one a physical step the engine executes on the Kafka stream. This is compute decomposition: no embeddings, no reasoning, just the relational plan that turns raw telemetry into a structured "breach + why" event.</p>
  <div class="card">
    <h3><span class="ic">⚙️</span> Operator chain<span class="tag">6 physical operators</span></h3>
    <div class="pipe">

        ["Window + watermark","TumblingWindow","Assign a 10-second tumbling window and a watermark to bound out-of-order readings."],
        ["Feature aggregation","GroupAggregate","Per window, compute v_avg, v_std, v_delta over the raw values — the model's serving features."],
        ["Score (model UDF)","PDM_SCORE","Call the per-parameter PdM model as a scalar UDF; emit the breach probability."],
        ["Filter / CEP","Filter","Keep only rows where P(breach) crosses the alarm threshold — the RED trigger condition."],
        ["Sink","TableSink","Enrich with the top driver (TOP_DRIVER UDF) and write the breach+why event to breach.events."],
      ].map(([nm,op,d],i)=>`<div class="pipe-op done">
        <div class="pipe-dot">${i+1}</div>
        <div class="pipe-body"><div class="pipe-nm">${nm} <span class="mono-tag" style="color:var(--cyan)">${op}</span></div>
        <div class="pipe-dt">${d}</div></div></div>`).join('')}
    </div>
  </div>
  <div class="card">
    <h3><span class="ic">📄</span> The query it compiles from<span class="tag">01_breach_detection.sql</span></h3>
    <pre class="code"><span class="cm">-- continuous query: telemetry → breach + why</span>
<span class="kw">INSERT INTO</span> breach_events
<span class="kw">SELECT</span>
  param, asset,
  <span class="fn">TUMBLE_START</span>(event_time, <span class="kw">INTERVAL</span> <span class="fn">'10'</span> SECOND) <span class="kw">AS</span> win_start,
  <span class="fn">AVG</span>(value) <span class="kw">AS</span> v_avg,
  <span class="fn">STDDEV_POP</span>(value) <span class="kw">AS</span> v_std,
  <span class="fn">PDM_SCORE</span>(param, <span class="fn">AVG</span>(value), <span class="fn">STDDEV_POP</span>(value)) <span class="kw">AS</span> p_breach,
  <span class="fn">TOP_DRIVER</span>(param, <span class="fn">LAST_VALUE</span>(features)) <span class="kw">AS</span> why
<span class="kw">FROM</span> telemetry
<span class="kw">GROUP BY</span> param, asset, <span class="fn">TUMBLE</span>(event_time, <span class="kw">INTERVAL</span> <span class="fn">'10'</span> SECOND)
<span class="kw">HAVING</span> <span class="fn">PDM_SCORE</span>(param, <span class="fn">AVG</span>(value), <span class="fn">STDDEV_POP</span>(value)) &gt;= <span class="fn">0.5</span>;</pre>
    <div class="note">Embedding, retrieval and reasoning never happen in the stream engine — Flink's job is only to decide <b>that</b> a breach is coming and <b>why</b>, then hand off. The semantic work belongs to the agent layer.</div>
  </div>`;

const FLINK_OPS = [
  ["Ingest window","reading raw telemetry from scada.telemetry"],
  ["Window + watermark","10s tumbling window closed; 42 readings bounded"],
  ["Aggregate features","v_avg, v_std, v_delta computed for the window"],
  ["Score (PDM_SCORE)","per-parameter model UDF → P(breach)"],
  ["Filter threshold","P(breach) ≥ alarm → row survives, flagged RED"],
  ["Emit breach+why","TOP_DRIVER attached; event written to breach.events"],
];
function renderFlinkPipe(active){
  const p = S.lastEvent?.param || 'temp';
  const why = (IV_MAP[p]||IV_MAP.temp).slice(0,3);
  const pb = S.lastEvent?.p_breach || S.training[p]?.auc || 0.9;
  const outs = [
    `partition=${p} offset=+42`,
    `window=[t, t+10s) count=42`,
    `v_avg=${(S.bands.find(b=>b.param===p)?.alarm[1]||38)} v_std=0.31 v_delta=+0.12`,
    `PDM_SCORE(${p}) = ${(+pb).toFixed(3)}`,
    `${(+pb).toFixed(3)} ≥ threshold → RED`,
    `{param:${p}, p_breach:${(+pb).toFixed(3)}, why:[${why.join(', ')}]}`,
  ];
  $('#flinkPipe').innerHTML = FLINK_OPS.map(([nm,d],i)=>`
    <div class="pipe-op ${i<active?'done':i===active?'active':''}">
      <div class="pipe-dot">${i<active?'✓':i+1}</div>
      <div class="pipe-body"><div class="pipe-nm">${nm}</div><div class="pipe-dt">${d}</div>
        <div class="pipe-out">${esc(outs[i])}</div></div></div>`).join('');
}
async function runFlink(){
  $('#runFlink').disabled = true; $('#flinkEmit').innerHTML='';
  for(let i=0;i<FLINK_OPS.length;i++){ renderFlinkPipe(i); await new Promise(r=>setTimeout(r,650)); }
  renderFlinkPipe(FLINK_OPS.length);
  const p = S.lastEvent?.param || 'temp';
  const why = (IV_MAP[p]||IV_MAP.temp).slice(0,3);
  const pb = S.lastEvent?.p_breach || S.training[p]?.auc || 0.9;
  $('#flinkEmit').innerHTML = `<div class="card"><h3><span class="ic">📤</span> Emitted event → breach.events<span class="tag">RAG layer consumes this</span></h3>
    <pre class="code">{

  <span class="kw">"why"</span>: [${why.map(w=>`<span class="fn">"${w}"</span>`).join(', ')}]
}</pre>
    <div class="note ok">✓ This enriched "breach + why" event is exactly what the agent's RAG query consumes next.</div></div>`;
  $('#runFlink').disabled = false;
}

}
function renderRowPipe(id, active, details){
  const el = $('#bpipe-'+id); if(!el) return;
  el.innerHTML = BUILD_STAGES.map(([nm,d],i)=>`
    <div class="pipe-op ${i<active?'done':i===active?'active':''}">

      <div class="pipe-body"><div class="pipe-nm">${nm}</div>
