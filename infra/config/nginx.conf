server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index studio.html;

    # Discard root link & redirect to /studio
    location = / {
        return 307 /studio;
    }

    # Activate /studio
    location /studio {
        try_files /studio.html =404;
    }

    location /studio.html {
        try_files /studio.html =404;
    }

    # proxy API calls so the browser sees a single origin
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
