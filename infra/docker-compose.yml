# =====================================================================
# BioSCADA AI — full local stack. Every component is free / open source.
#
#   Redpanda   Kafka-compatible broker (BSL, free to self-host) - lighter
#              than Kafka+ZooKeeper for a single-node demo
#   Flink      JobManager + TaskManager (Apache-2.0)
#   Qdrant     vector store (Apache-2.0)
#   Postgres   audit trail + app state (PostgreSQL licence)
#   Keycloak   OAuth2 / OIDC identity (Apache-2.0)  -> replaces commercial IdP
#   OPA        policy decision point (Apache-2.0)   -> replaces Apigee policy
#   Kong       API gateway (Apache-2.0)             -> replaces Apigee gateway
#   MinIO      S3-compatible object store (AGPL-3.0) -> WORM via object-lock
#   MLflow     experiment tracking + model registry (Apache-2.0)
#   Prometheus + Grafana  metrics & dashboards (Apache-2.0 / AGPL-3.0)
#   Ollama     local LLM server (MIT) - no data leaves the network
#
# Start core only:   docker compose up -d redpanda flink-jobmanager api frontend
# Start everything:  docker compose --profile full up -d
# =====================================================================
name: bioscada

x-common: &common
  restart: unless-stopped
  networks: [bioscada]

services:
  # -------------------------------------------------------------- broker
  redpanda:
    <<: *common
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --check=false
    ports: ["9092:9092", "9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  console:
    <<: *common
    image: redpandadata/console:v2.7.2
    profiles: [full]
    depends_on: [redpanda]
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports: ["8085:8080"]

  # -------------------------------------------------------------- flink
  flink-jobmanager:
    <<: *common
    image: flink:1.19-scala_2.12-java11
    command: jobmanager
    ports: ["8081:8081"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
    volumes:
      - ../services/flink-jobs:/opt/flink-jobs:ro
      - ../services/ml/models:/opt/models:ro

  flink-taskmanager:
    <<: *common
    image: flink:1.19-scala_2.12-java11
    command: taskmanager
    depends_on: [flink-jobmanager]
    deploy:
      replicas: 1
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ../services/flink-jobs:/opt/flink-jobs:ro
      - ../services/ml/models:/opt/models:ro

  # -------------------------------------------------------- vector store
  qdrant:
    <<: *common
    image: qdrant/qdrant:v1.11.3
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  # ------------------------------------------------------------ postgres
  postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bioscada
      POSTGRES_PASSWORD: bioscada
      POSTGRES_DB: bioscada
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioscada"]
      interval: 10s
      retries: 8

  # ------------------------------------------------------------ identity
  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:25.0
    profiles: [full]
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro

  # -------------------------------------------------------------- policy
  opa:
    <<: *common
    image: openpolicyagent/opa:0.68.0-rootless
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports: ["8181:8181"]
    volumes: ["./config/opa:/policies:ro"]

  # ------------------------------------------------------------- gateway
  kong:
    <<: *common
    image: kong:3.7
    profiles: [full]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports: ["8800:8000", "8801:8001"]
    volumes: ["./config/kong.yml:/kong/kong.yml:ro"]

  # -------------------------------------------------------- object store
  minio:
    <<: *common
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    profiles: [full]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bioscada
      MINIO_ROOT_PASSWORD: bioscada123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  # -------------------------------------------------------------- mlflow
  mlflow:
    <<: *common
    image: ghcr.io/mlflow/mlflow:v2.16.2
    profiles: [full]
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow_data:/mlruns]

  # ----------------------------------------------------------------- llm
  ollama:
    <<: *common
    image: ollama/ollama:0.3.12
    profiles: [full, llm]
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    # Uncomment for GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  # ----------------------------------------------------------- telemetry
  prometheus:
    <<: *common
    image: prom/prometheus:v2.54.1
    profiles: [full]
    ports: ["9090:9090"]
    volumes: ["./config/prometheus:/etc/prometheus:ro"]

  grafana:
    <<: *common
    image: grafana/grafana:11.2.0
    profiles: [full]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: bioscada
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports: ["3001:3000"]
    volumes: [grafana_data:/var/lib/grafana]

  # ==================================================== application tier
  simulator:
    <<: *common
    build: {context: .., dockerfile: infra/docker/Dockerfile.simulator}
    depends_on:
      redpanda: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      RATE_HZ: "2"
      CONTROL_PORT: "8081"
    ports: ["8082:8081"]

  api:
    <<: *common
    build: {context: .., dockerfile: infra/docker/Dockerfile.api}
    depends_on:
      redpanda: {condition: service_healthy}
      qdrant: {condition: service_started}
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      SIMULATOR_URL: http://simulator:8081
      MODEL_DIR: /app/models
      OPA_URL: http://opa:8181
    ports: ["8000:8000"]
    volumes:
      - ../services/ml/models:/app/models:ro
      - ../data:/app/data:ro

  frontend:
    <<: *common
    build: {context: .., dockerfile: infra/docker/Dockerfile.frontend}
    depends_on: [api]
    ports: ["3000:80"]

networks:
  bioscada:
    driver: bridge

volumes:
  qdrant_data:
  pg_data:
  minio_data:
  mlflow_data:
  ollama_data:
  grafana_data:
